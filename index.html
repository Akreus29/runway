<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Runway</title>
<meta name="description" content="A private rupee budget and expense tracker: daily safe-to-spend, auto-sorted UPI payments, monthly reviews and a year-end Wrapped. Your data stays on your device.">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Runway">
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.callout-card{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;background:var(--accent-wash);border-color:transparent;box-shadow:none;padding:14px 18px}
.callout-card p{margin:0;flex:1 1 320px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — sticky header with tabs (bottom tab bar on phones), one scrolling work area of cards in a 12-col grid. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eaeef3; --ink:#111821; --ink-2:#4a5563; --muted:#7a8492;
  --line:#dde3ea; --line-strong:#c4ccd6;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:rgba(42,120,214,.10); --on-accent:#ffffff;
  --s-last:#a3acb7; --s-area:rgba(42,120,214,.10);
  --good:#0ca30c; --good-ink:#1a7a2a; --good-wash:rgba(12,163,12,.10);
  --warn:#fab219; --warn-ink:#8a5a00; --warn-wash:rgba(250,178,25,.16);
  --bad:#d03b3b; --bad-ink:#b42828; --bad-wash:rgba(208,59,59,.10);
  --shadow:0 1px 2px rgba(17,24,33,.05),0 4px 16px rgba(17,24,33,.05);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1116; --surface:#161b22; --surface-2:#1e252e; --ink:#eef2f6; --ink-2:#b3bdc8; --muted:#848e9a;
    --line:#29313b; --line-strong:#3a434f;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:rgba(57,135,229,.16); --on-accent:#ffffff;
    --s-last:#5d6773; --s-area:rgba(57,135,229,.16);
    --good:#0ca30c; --good-ink:#4cc75a; --good-wash:rgba(12,163,12,.16);
    --warn:#fab219; --warn-ink:#f5c04a; --warn-wash:rgba(250,178,25,.14);
    --bad:#d03b3b; --bad-ink:#f07a7a; --bad-wash:rgba(208,59,59,.18);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1116; --surface:#161b22; --surface-2:#1e252e; --ink:#eef2f6; --ink-2:#b3bdc8; --muted:#848e9a;
  --line:#29313b; --line-strong:#3a434f;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:rgba(57,135,229,.16); --on-accent:#ffffff;
  --s-last:#5d6773; --s-area:rgba(57,135,229,.16);
  --good:#0ca30c; --good-ink:#4cc75a; --good-wash:rgba(12,163,12,.16);
  --warn:#fab219; --warn-ink:#f5c04a; --warn-wash:rgba(250,178,25,.14);
  --bad:#d03b3b; --bad-ink:#f07a7a; --bad-wash:rgba(208,59,59,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--f-body);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ink);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;background:repeating-linear-gradient(to bottom,var(--bg) 0 3px,transparent 3px 6px)}
.tabs{display:flex;gap:4px;flex:1}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--ink-2);font-weight:600;cursor:pointer}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.top-actions{display:flex;align-items:center;gap:10px}
.save-state{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.save-state[data-s="db"]::before,.save-state[data-s="local"]::before{background:var(--good)}
.save-state[data-s="demo"]::before{background:var(--warn)}
.save-state[data-s="busy"]::before{background:var(--accent)}
.bottom-tabs{display:none}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.banner{max-width:1180px;margin:16px auto 0;padding:0 20px}
.banner-in{background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap}
.banner-in p{margin:0;flex:1 1 320px;color:var(--ink)}
.banner-in strong{font-weight:700}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
label.field{display:grid;gap:5px;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.money-in{position:relative}
.money-in span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.95rem}
.money-in .in{padding-left:calc(14px + var(--sym-w,0.7em))}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- cards & grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:.84rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
@media (max-width:960px){.stack{gap:14px}.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:20px}}
.hero-fig{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
.hero-fig .big{font-family:var(--f-display);font-size:clamp(2.8rem,7vw,4.4rem);font-weight:700;letter-spacing:-.035em;line-height:1}
.hero-fig .unit{font-family:var(--f-display);font-size:1.3rem;color:var(--ink-2);font-weight:600}
.hero p{margin:0;color:var(--ink-2);max-width:56ch}
.hero p + p{margin-top:8px}
.hero strong{color:var(--ink)}
.strip{display:grid;gap:14px}
.strip-row{display:grid;gap:6px}
.strip-lab{display:flex;justify-content:space-between;font-size:.84rem;color:var(--ink-2);gap:10px}
.strip-lab b{color:var(--ink);font-weight:600}
.track{height:12px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink-2)}
.track.time i{background:var(--s-last)}
.track.spend i{background:var(--accent)}
.track.spend.warn i{background:var(--warn)}
.track.spend.bad i{background:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-wash);color:var(--good-ink)}
.pill.warn{background:var(--warn-wash);color:var(--warn-ink)}
.pill.bad{background:var(--bad-wash);color:var(--bad-ink)}
.pill.bad::before{border-radius:2px}
.pill.warn::before{border-radius:2px;transform:rotate(45deg);width:7px;height:7px}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;align-content:start}
.kpi .v{font-family:var(--f-display);font-size:1.65rem;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.kpi .s{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-weight:700;font-size:.8rem}
.delta.up{color:var(--bad-ink)}.delta.down{color:var(--good-ink)}
.delta.good{color:var(--good-ink)}.delta.bad{color:var(--bad-ink)}

/* ---------- charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-data);font-size:11px;fill:var(--muted)}
.chart .lab{font-family:var(--f-body);font-size:12px;fill:var(--ink-2);font-weight:600}
.chart .lab-v{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.legend i.last{border-color:var(--s-last)}
.legend i.proj{border-top-style:dashed}
.legend i.plan{border-top:1.5px dashed var(--ink-2)}
.legend i.box{width:12px;height:12px;border:0;border-radius:3px;background:var(--accent)}
.legend i.tick{width:14px;border-top:3px solid var(--ink)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:.8rem;line-height:1.45;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tip b{display:block;font-weight:700;margin-bottom:2px}
.tip .row{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}

/* ---------- category budget rows ---------- */
.cats{display:grid;gap:14px}
.cat-group{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:6px;border-top:1px solid var(--line)}
.cat-group:first-child{border-top:0;padding-top:0}
.crow{display:grid;gap:6px}
.crow-top{display:flex;align-items:center;gap:10px;font-size:.92rem}
.crow-top .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-top .amt{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.86rem;white-space:nowrap}
.crow-top .amt b{color:var(--ink);font-weight:600}
.cbar{height:8px;border-radius:999px;background:var(--surface-2);position:relative}
.cbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);max-width:100%}
.cbar.warn i{background:var(--warn)}
.cbar.bad i{background:var(--bad)}
.cbar.done i{background:var(--ink-2)}
.cbar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;box-shadow:0 0 0 2px var(--surface)}
.crow-foot{font-size:.78rem;color:var(--muted)}

/* review bars */
.rbars{display:grid;gap:10px}
.rbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 86px 74px;align-items:center;gap:12px;font-size:.88rem;cursor:default;padding:2px 0}
.rbar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .v{text-align:right;font-variant-numeric:tabular-nums}
.rbar .dl{text-align:right}
.rtrack{height:14px;position:relative}
.rtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--accent)}
.rtrack i.over{background:var(--bad)}
.rtrack .bm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
@media (max-width:560px){.rbar{grid-template-columns:minmax(0,1fr) 78px 64px}.rbar .rtrack{grid-column:1 / -1;grid-row:2}}

/* ---------- transactions ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1 1 200px}
.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:2px}
.monthnav button{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem;color:var(--ink-2)}
.monthnav button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.monthnav button:disabled{opacity:.35;cursor:default}
.monthnav span{min-width:128px;text-align:center;font-weight:600;font-size:.92rem}
.txday{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:14px 4px 6px;border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx-main{border:0;background:none;text-align:left;padding:0;cursor:pointer;min-width:0;display:grid}
.tx-main:hover .tx-desc{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.tx-desc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:84px}
.tx-amt.pos{color:var(--good-ink)}
.catpick{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 26px 4px 11px;font-size:.8rem;font-weight:600;color:var(--ink-2);cursor:pointer;max-width:170px;text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.catpick:hover{border-color:var(--line-strong);color:var(--ink)}
.catpick.unsorted{background-color:var(--warn-wash);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn-ink)}
.chip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--good-wash);color:var(--good-ink)}
@media (max-width:560px){.tx{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.tx .catpick,.tx .chip{grid-row:2;justify-self:start}.tx-amt{grid-row:1;grid-column:2}}
.callout{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--accent-wash);margin-bottom:14px;font-size:.9rem}
.callout p{margin:0;flex:1 1 260px}

.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:1.1rem;margin-bottom:6px;color:var(--ink)}
.empty p{margin:0 auto 14px;max-width:46ch}

/* lists */
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.li:last-child{border-bottom:0}
.li .a{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.li .c{font-size:.78rem;color:var(--muted);grid-column:1 / -1}
.summary-line{font-size:1.08rem;color:var(--ink-2);max-width:70ch;margin:0}
.summary-line strong{color:var(--ink)}

/* ---------- budget editor ---------- */
.plan-eq{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:.95rem}
.plan-eq .t{display:grid}
.plan-eq .t span{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.plan-eq .t b{font-family:var(--f-display);font-size:1.5rem;font-weight:650;letter-spacing:-.02em}
.plan-eq .op{font-family:var(--f-display);font-size:1.4rem;color:var(--muted)}
.settings-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:700px){.settings-row{grid-template-columns:1fr}}
.cat-edit{display:grid;grid-template-columns:minmax(0,1.2fr) 130px 150px minmax(0,2fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cat-edit:last-child{border-bottom:0}
.cat-edit-h{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
@media (max-width:820px){.cat-edit{grid-template-columns:minmax(0,1fr) 120px}.cat-edit .kw{grid-column:1 / -1;order:5}.cat-edit-h{display:none}}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.switch input{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(860px,calc(100vw - 24px))}

<body>
<header class="top">
  <div class="top-in">

</header>
<div class="banner" id="banner" hidden></div>
<main id="view" aria-live="polite"></main>
<nav class="bottom-tabs" aria-label="Sections">
  <button data-tab="overview">This month</button>
  <button data-tab="review">Last month</button>
  <button data-tab="tx">Transactions</button>
  <button data-tab="year">Year</button>
  <button data-tab="budget">Budget</button>
</nav>

<dialog id="txDialog"><form class="dlg" id="txForm" autocomplete="off">
  <div class="dlg-h"><h2 id="txTitle">Add expense</h2>
    <div class="seg" role="group" aria-label="Type"><button type="button" id="typeExp" aria-pressed="true">Expense</button><button type="button" id="typeInc" aria-pressed="false">Income</button></div>

</form></dialog>

<script>
"use strict";
/* ============================================================
   Helpers (India: rupees, lakh/crore grouping, day-first dates)
   ============================================================ */
const LOCALE = "en-IN";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((x, y) => x + y, 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const mkOf = iso => iso.slice(0, 7);
const curMK = () => mkOf(todayISO());
const curYear = () => +curMK().slice(0, 4);
function addMonths(mk, n) { let [y, m] = mk.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; }
const daysIn = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const mDate = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m - 1, 1); };
const monthLong = mk => mDate(mk).toLocaleString(LOCALE, { month: "long" });
const monthShort = mk => mDate(mk).toLocaleString(LOCALE, { month: "short" });
const monthYear = mk => mDate(mk).toLocaleString(LOCALE, { month: "long", year: "numeric" });
const dateObj = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const dateNice = iso => dateObj(iso).toLocaleDateString(LOCALE, { weekday: "short", day: "numeric", month: "short" });
const dateLong = iso => dateObj(iso).toLocaleDateString(LOCALE, { day: "numeric", month: "long" });
const dayShort = (mk, d) => `${d} ${monthShort(mk)}`;
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS3 = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

const fmtCache = {};
function fmt(cents, compact) {
  const k = "" + cents + compact;
  if (!fmtCache[k]) fmtCache[k] = new Intl.NumberFormat(LOCALE, compact
    ? { style: "currency", currency: "INR", notation: "compact", minimumFractionDigits: 0, maximumFractionDigits: 1 }
    : { style: "currency", currency: "INR", minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return fmtCache[k];
}
function money(v, o = {}) {
  const hasPaise = Math.abs(v - Math.round(v)) > 0.004;
  const cents = (o.cents ?? Math.abs(v) < 100) && hasPaise;
  let s = fmt(!!cents, !!o.compact).format(Math.abs(v));
  if (v < -0.004) s = "−" + s; else if (o.sign && v > 0.004) s = "+" + s;
  return s;
}
const moneyBig = v => Math.abs(v) >= 100000 ? money(v, { compact: true }) : money(v);
const curSymbol = () => "₹";
function parseAmt(s) {
  if (typeof s === "number") return s;
  s = String(s || "").trim();
  if (!s) return NaN;
  const neg = /^\(.*\)$/.test(s) || /^[-−–]/.test(s) || /[-−]$/.test(s) || /\bDR\b/i.test(s);
  s = s.replace(/[^\d.]/g, "");
  const v = parseFloat(s);
  return isNaN(v) ? NaN : (neg ? -v : v);
}

function buildKwIndex() {

// "UPI-SWIGGY LIMITED-swiggy@axis-UTIB0000-6287..." or "UPI/DR/6287.../ZOMATO/HDFC/..." -> "Swiggy Limited" / "Zomato"
function prettyMerchant(desc) {
  let s = String(desc || "").trim();
  const m = s.match(/^(?:upi|imps|neft|rtgs|pos)\s*[-\/:]\s*(?:(?:p2m|p2a|dr|cr|in|out)\s*[-\/]\s*)?(?:\d{6,}\s*[-\/]\s*)?([^-\/@|]+)/i);

}
function merchantKey(desc) {
  let s = prettyMerchant(desc).toLowerCase();
  s = s.replace(/^(sq|tst|pp|paypal|bil|ach)\s*\*\s*/, "");
  s = s.replace(/\b(pos|debit|credit|purchase|card|visa|mastercard|rupay|ach|nach|pmt|payment|recurring|online|transfer|upi|imps|neft|ltd|limited|pvt|private|india|technologies)\b/g, " ");
  s = s.replace(/[#*][\w-]*/g, " ").replace(/\d+/g, " ").replace(/[^a-z&' ]/g, " ").replace(/\s+/g, " ").trim();

}

function stats(mk) {
  const tx = S.months[mk] || [];
  const n = daysIn(mk);
  const byCat = {}; S.settings.categories.forEach(c => byCat[c.id] = 0);
  const daily = new Array(n).fill(0);
  let spent = 0, income = 0, invested = 0, count = 0;
  for (const t of tx) {
    if (t.type === "income") { income += t.amount; continue; }
    const cid = byCat[t.cat] !== undefined ? t.cat : "other";
    byCat[cid] += t.amount;
    if (kindOf(cid) === "saving") { invested += t.amount; continue; }
    spent += t.amount; count++;
    const d = +t.date.slice(8, 10); if (d >= 1 && d <= n) daily[d - 1] += t.amount;
  }
  const cum = []; let a = 0; daily.forEach((v, i) => { a += v; cum[i] = a; });
  return { mk, tx, n, byCat, daily, cum, spent, income, invested, count };
}
const spendCats = () => S.settings.categories.filter(c => c.kind !== "saving");
const planCap = () => sum(spendCats().map(c => c.budget));
function outlook(mk) {
  const st = stats(mk), n = st.n;
  const isCur = mk === curMK();
  const d = isCur ? +todayISO().slice(8) : n;
  let fixedCommitted = 0, fixedDue = 0, flexSpent = 0, flexBudget = 0;
  for (const c of spendCats()) {
    const sp = st.byCat[c.id] || 0;
    if (c.kind === "fixed") { fixedCommitted += Math.max(c.budget, sp); fixedDue += Math.max(0, c.budget - sp); }
    else { flexSpent += sp; flexBudget += c.budget; }
  }
  const cap = planCap();
  const left = cap - fixedCommitted - flexSpent;
  const daysLeft = n - d + 1;
  const perDay = Math.max(0, left) / daysLeft;
  const K = Math.max(0, 10 - d);                // first ~10 days: blend actual pace with planned pace
  const rate = (flexSpent + (flexBudget / n) * K) / (d + K);
  const projected = isCur ? fixedCommitted + flexSpent + rate * (n - d) : st.spent;
  const income = Math.max(S.settings.income, st.income);
  const projSave = income - projected;
  let status = "ok";
  if (cap <= 0) status = "noplan"; else if (left < 0 || (projected > cap * 1.05 && (d >= 7 || !isCur))) status = "over"; else if (projected > cap) status = "tight";
  return { st, n, d, isCur, cap, left, daysLeft, perDay, projected, income, projSave, fixedCommitted, fixedDue, flexSpent, flexBudget, rate, status };
}

  let p = `M${X(0)},${Y(0)}`; for (let i = 1; i <= d; i++) p += `L${X(i)},${Y(st.cum[i - 1])}`;
  g += `<path d="${p}L${X(d)},${Y(0)}Z" fill="var(--s-area)"/>`;
  g += `<path d="${p}" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>`;
  if (o.isCur && d < n) {
    g += `<path d="M${X(d)},${Y(endThis)}L${X(n)},${Y(o.projected)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>`;
    labels.push({ y: Y(o.projected), x: X(n) + 8, t: "Projected", v: money(o.projected) });
  }
  g += `<circle cx="${X(d)}" cy="${Y(endThis)}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 32) labels[i].y = labels[i - 1].y + 32;
  for (const l of labels) { l.y = Math.min(Math.max(l.y, mt + 6), H - mb - 18); g += `<text class="lab" x="${l.x}" y="${l.y - 2}">${l.t}</text><text class="lab-v" x="${l.x}" y="${l.y + 13}" font-weight="700">${esc(l.v)}</text>`; }
  g += `<line id="burnX" x1="0" x2="0" y1="${mt}" y2="${H - mb}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>`;
  g += `<rect id="burnHit" x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent"/>`;
  Object.assign(burnState, { mk, o, pv, hasPrev, W, ml, mr, n, X });
  return `<div class="chart" id="burn"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative spending this month compared with last month and your plan">${g}</svg></div>
  <div class="legend"><span><i></i>This month so far</span>${o.isCur && d < n ? `<span><i class="proj"></i>Projected at current pace</span>` : ""}${hasPrev ? `<span><i class="last"></i>${esc(monthLong(addMonths(mk, -1)))}</span>` : ""}${o.cap > 0 ? `<span><i class="plan"></i>Monthly plan</span>` : ""}</div>`;
}
function burnHover(e) {

  const b = burnState, r = svg.getBoundingClientRect();
  const vx = (e.clientX - r.left) / r.width * b.W;
  const i = Math.min(b.n, Math.max(1, Math.round((vx - b.ml) / (b.W - b.ml - b.mr) * b.n + 0.5)));
  const line = $("#burnX"); line.setAttribute("x1", b.X(i)); line.setAttribute("x2", b.X(i)); line.setAttribute("visibility", "visible");
  const o = b.o, st = o.st;
  let rows = "";
  if (i <= o.d) rows += `<div class="row"><span>Spent by then</span><span>${esc(money(st.cum[i - 1]))}</span></div><div class="row"><span>That day</span><span>${esc(money(st.daily[i - 1]))}</span></div>`;
  else { const base = st.cum[o.d - 1] || 0; rows += `<div class="row"><span>Projected</span><span>~${esc(money(base + (o.projected - base) * (i - o.d) / (o.n - o.d)))}</span></div>`; }
  if (b.hasPrev && i <= b.pv.n) rows += `<div class="row"><span>${esc(monthLong(addMonths(b.mk, -1)))}</span><span>${esc(money(b.pv.cum[i - 1]))}</span></div>`;
  if (o.cap > 0) rows += `<div class="row"><span>Even pace</span><span>${esc(money(o.cap * i / o.n))}</span></div>`;
  showTipHTML(`<b>${esc(dayShort(b.mk, i))}</b>${rows}`, e);
}

function dailyChart(mk) {
  const st = stats(mk), n = st.n;
  const W = 680, H = 210, ml = 50, mr = 12, mt = 14, mb = 28;
  const max = Math.max(...st.daily, 500) * 1.08, step = niceStep(max, 3), ymax = Math.ceil(max / step) * step;
  const bw = (W - ml - mr) / n, Y = v => H - mb - (v / ymax) * (H - mt - mb);
  let g = "";
  for (let v = 0; v <= ymax + 1e-6; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(money(v, { compact: true }))}</text>`;
  const avg = st.spent / n;
  st.daily.forEach((v, i) => {
    const x = ml + i * bw + 1, w = Math.max(1, bw - 2), y = Y(v);
    const items = st.tx.filter(t => t.type !== "income" && kindOf(t.cat) !== "saving" && +t.date.slice(8, 10) === i + 1).sort((a, b) => b.amount - a.amount);
    const tip = `<b>${esc(dateNice(`${mk}-${pad(i + 1)}`))}</b><div class="row"><span>Total</span><span>${esc(money(v))}</span></div>` + items.slice(0, 4).map(t => `<div class="row"><span>${esc(prettyMerchant(t.desc).slice(0, 22))}</span><span>${esc(money(t.amount))}</span></div>`).join("") + (items.length > 4 ? `<div class="row"><span>+${items.length - 4} more</span><span></span></div>` : "");
    g += `<g data-tiphtml="${esc(tip)}"><rect x="${ml + i * bw}" y="${mt}" width="${bw}" height="${H - mt - mb}" fill="transparent"/>${v > 0 ? `<path d="${barPath(x, y, w, Y(0) - y, 3)}" fill="${v > avg * 2.5 ? "var(--accent-ink)" : "var(--accent)"}"/>` : ""}</g>`;
  });
  g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-strong)"/>`;
  g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--ink-2)" stroke-dasharray="4 4" pointer-events="none"/><text class="lab" x="${W - mr}" y="${Y(avg) - 6}" text-anchor="end" pointer-events="none">Avg ${esc(money(avg))}/day</text>`;
  for (const t of [1, 8, 15, 22, n]) g += `<text x="${ml + (t - 0.5) * bw}" y="${H - 8}" text-anchor="middle">${t === 1 ? esc(dayShort(mk, 1)) : t}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending per day in ${esc(monthYear(mk))}">${g}</svg></div>`;
}

// spent bars + income ticks for a list of months
function monthsChart(mks, selMk) {
  const data = mks.map(mk => { const st = stats(mk); return { mk, spent: st.spent, invested: st.invested, income: st.income || (st.count ? S.settings.income : 0) }; });
  const W = 680, H = 230, ml = 54, mr = 12, mt = 14, mb = 30, k = mks.length;
  const max = Math.max(...data.map(d => Math.max(d.spent, d.income)), 1000) * 1.08, step = niceStep(max, 4), ymax = Math.ceil(max / step) * step;
  const gw = (W - ml - mr) / k, bw = Math.min(54, gw * 0.52), Y = v => H - mb - (v / ymax) * (H - mt - mb);
  let g = "";
  for (let v = 0; v <= ymax + 1e-6; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(money(v, { compact: true }))}</text>`;
  data.forEach((d, i) => {
    const cx = ml + gw * i + gw / 2, x = cx - bw / 2, sel = !selMk || d.mk === selMk;
    const tip = `<b>${esc(monthYear(d.mk))}</b><div class="row"><span>Spent</span><span>${esc(money(d.spent))}</span></div><div class="row"><span>Income</span><span>${esc(money(d.income))}</span></div>${d.invested ? `<div class="row"><span>Invested</span><span>${esc(money(d.invested))}</span></div>` : ""}<div class="row"><span>Saved</span><span>${esc(money(d.income - d.spent))}</span></div>`;
    g += `<g data-tiphtml="${esc(tip)}"><rect x="${ml + gw * i}" y="${mt}" width="${gw}" height="${H - mt - mb}" fill="transparent"/>`;
    if (d.spent > 0) g += `<path d="${barPath(x, Y(d.spent), bw, Y(0) - Y(d.spent), 4)}" fill="var(--accent)" opacity="${sel ? 1 : 0.55}"/>`;
    if (d.income > 0) g += `<line x1="${x - 5}" x2="${x + bw + 5}" y1="${Y(d.income)}" y2="${Y(d.income)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
    g += `<text x="${cx}" y="${H - 9}" text-anchor="middle" ${selMk && d.mk === selMk ? 'font-weight="700" style="fill:var(--ink)"' : ""}>${esc(monthShort(d.mk))}</text></g>`;
  });
  g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-strong)"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spending and income">${g}</svg></div><div class="legend"><span><i class="box"></i>Spent</span><span><i class="tick"></i>Income</span></div>`;
}

/* ============================================================
   Views
   ============================================================ */
function statusPill(s) {
  return { ok: `<span class="pill good">On track</span>`, tight: `<span class="pill warn">Tight</span>`, over: `<span class="pill bad">Over plan</span>`, noplan: `<span class="pill neutral">No plan yet</span>` }[s];
}
function catRows(o) {
  const st = o.st, frac = o.d / o.n;
  const row = c => {
    const sp = st.byCat[c.id] || 0, b = c.budget, pct = b > 0 ? sp / b : (sp > 0 ? 1 : 0);
    let cls = "", chip = "", foot = "";
    if (c.kind === "saving") {
      if (b > 0 && sp >= b) chip = `<span class="pill good">Target reached</span>`;
      foot = b > 0 ? (sp >= b ? `${money(sp)} invested this month` : `${money(b - sp)} to go for your monthly target`) : `${money(sp)} invested`;
      cls = "save";
    } else if (c.kind === "fixed") {
      cls = sp >= b && b > 0 ? "done" : "";
      if (sp > b && b > 0) { cls = "bad"; chip = `<span class="pill bad">Over</span>`; foot = `${money(sp - b)} more than planned`; }
      else foot = b - sp > 0.5 ? `${money(b - sp)} still to pay` : "Paid";
    } else {
      if (sp > b) { cls = "bad"; chip = `<span class="pill bad">Over</span>`; foot = b > 0 ? `${money(sp - b)} over budget` : "No budget set"; }
      else if (o.isCur && b > 0 && pct > frac * 1.15 + 0.05) { cls = "warn"; chip = `<span class="pill warn">Ahead of pace</span>`; foot = `${money(b - sp)} left · ${money((b - sp) / o.daysLeft)}/day`; }
      else foot = b > 0 ? `${money(b - sp)} left${o.isCur ? ` · ${money((b - sp) / o.daysLeft)}/day` : ""}` : "No budget set";
    }
    const pace = c.kind === "everyday" && o.isCur && b > 0 ? `<span class="pace" style="left:calc(${(frac * 100).toFixed(1)}% - 1px)" title="Where you'd be at an even pace"></span>` : "";
    return `<div class="crow" data-tip="${esc(c.name)}|Spent ${esc(money(sp, { cents: true }))} of ${esc(money(b))}${c.kind === "everyday" && o.isCur && b > 0 ? "|Even pace by today: " + esc(money(b * frac)) : ""}">
      <div class="crow-top"><span class="name">${esc(c.name)}</span>${chip}<span class="amt"><b>${esc(money(sp))}</b> / ${esc(money(b))}</span></div>
      <div class="cbar ${cls}"><i style="width:${Math.min(100, pct * 100).toFixed(1)}%"></i>${pace}</div>
      <div class="crow-foot">${esc(foot)}</div></div>`;
  };
  const cats = S.settings.categories.filter(c => c.budget > 0 || (st.byCat[c.id] || 0) > 0);
  const flex = cats.filter(c => c.kind === "everyday").sort((a, b) => (st.byCat[b.id] || 0) / (b.budget || 1) - (st.byCat[a.id] || 0) / (a.budget || 1));
  const fixed = cats.filter(c => c.kind === "fixed"), saving = cats.filter(c => c.kind === "saving");
  return `<div class="cats"><div class="cat-group">Everyday spending</div>${flex.map(row).join("")}${fixed.length ? `<div class="cat-group">Fixed bills</div>${fixed.map(row).join("")}` : ""}${saving.length ? `<div class="cat-group">Savings & SIPs</div>${saving.map(row).join("")}` : ""}</div>`;
}

function txRow(t) {
  const inc = t.type === "income";

  return `<div class="tx">
    <button class="tx-main" data-action="edit" data-id="${esc(t.id)}" data-mk="${mkOf(t.date)}"><span class="tx-desc">${esc(name)}</span><span class="tx-meta">${esc(dateNice(t.date))}${t.note ? " · " + esc(t.note) : ""}${name !== t.desc ? " · " + esc(t.desc) : ""}</span></button>
    ${inc ? `<span class="chip">Income</span>` : `<select class="catpick${unsorted ? " unsorted" : ""}" id="cp-${esc(t.id)}" data-id="${esc(t.id)}" data-mk="${mkOf(t.date)}" aria-label="Category for ${esc(name)}">${catOptions(t.cat)}</select>`}
    <span class="tx-amt ${inc ? "pos" : ""}">${inc ? "+" : ""}${esc(money(t.amount, { cents: true }))}</span></div>`;
}

function wrappedNudge() {
  const t = todayISO(), m = +t.slice(5, 7), d = +t.slice(8);

function viewReview() {
  const mk = S.reviewMonth, st = stats(mk), pmk = addMonths(mk, -1), pv = stats(pmk), set = S.settings;
  const income = st.income || (st.count ? set.income : 0), saved = income - st.spent, rate = income > 0 ? saved / income : 0;
  const pIncome = pv.income || (pv.count ? set.income : 0), pSaved = pIncome - pv.spent;
  const cap = planCap();
  const nav = `<div class="monthnav"><button data-action="rev-prev" aria-label="Previous month">‹</button><span>${esc(monthYear(mk))}</span><button data-action="rev-next" aria-label="Next month" ${mk >= curMK() ? "disabled" : ""}>›</button></div>`;
  if (!st.tx.length) return `<div class="toolbar">${nav}</div><div class="card"><div class="empty"><h3>No transactions in ${esc(monthYear(mk))}</h3><p>Import your bank statement for that month and Runway will break it down by category, day and merchant.</p><button class="btn primary" data-action="import">Import bank statement</button></div></div>`;
  const d = (v, pvv, goodWhenUp) => { if (!pv.count) return ""; const diff = v - pvv; if (Math.abs(diff) < 1) return `<span class="delta">no change</span>`; const up = diff > 0; return `<span class="delta ${up === goodWhenUp ? "good" : "bad"}">${up ? "▲" : "▼"} ${esc(money(Math.abs(diff)))}</span>`; };
  const cats = spendCats().map(c => ({ c, v: st.byCat[c.id] || 0, p: pv.byCat[c.id] || 0 })).filter(x => x.v > 0 || x.c.budget > 0).sort((a, b) => b.v - a.v);
  const max = Math.max(...cats.map(x => Math.max(x.v, x.c.budget)), 1);
  const overCats = cats.filter(x => x.c.budget > 0 && x.v > x.c.budget);

    const diff = x.v - x.p, over = x.c.budget > 0 && x.v > x.c.budget;

      <span class="nm">${esc(x.c.name)}</span>

      <span class="dl">${pv.count && Math.abs(diff) >= 1 ? `<span class="delta ${diff > 0 ? "up" : "down"}">${diff > 0 ? "▲" : "▼"} ${esc(money(Math.abs(diff)))}</span>` : `<span class="muted">—</span>`}</span></div>`;
  }).join("");
  const mer = {};
  for (const t of st.tx) if (t.type !== "income" && kindOf(t.cat) !== "saving") { const k = merchantKey(t.desc) || t.desc.toLowerCase(); (mer[k] = mer[k] || { name: prettyMerchant(t.desc), total: 0, n: 0, cat: t.cat }); mer[k].total += t.amount; mer[k].n++; }
  const topM = Object.values(mer).sort((a, b) => b.total - a.total).slice(0, 6);
  const big = st.tx.filter(t => t.type !== "income" && kindOf(t.cat) !== "saving").sort((a, b) => b.amount - a.amount).slice(0, 5);
  const topCat = cats[0];
  const sixMonths = [5, 4, 3, 2, 1, 0].map(b => addMonths(mk, -b));
  return `<div class="toolbar">${nav}</div>

const VIEWS = { overview: viewOverview, review: viewReview, tx: viewTx, year: viewYear, budget: viewBudget };

/* ============================================================
   Wrapped — a story of the year, one slide at a time
   ============================================================ */
const W_COLORS = {
  night: ["#141414", "#fbf3e4", "#f6a21a"], marigold: ["#f6a21a", "#1d1305", "#1d1305"], rani: ["#c2185b", "#fff1f5", "#ffd166"],
  peacock: ["#0d5c63", "#e8fbf8", "#f6c445"], indigo: ["#24206b", "#f1efff", "#ff9e7a"], vermilion: ["#d94a1e", "#fff3ec", "#1d1305"], leaf: ["#2d6a2f", "#f1f9ec", "#f6c445"],
};
const wr = { y: null, ys: null, slides: [], i: 0 };
function wSlide(color, inner) { return { color, inner }; }
function wBars(rows, fg) {
  const max = Math.max(...rows.map(r => r.v), 1);
  return `<div class="w-bars">${rows.map(r => `<div class="w-bar"><span class="w-bar-l">${esc(r.l)}</span><span class="w-bar-t"><i style="width:${Math.max(2, r.v / max * 100).toFixed(1)}%;${r.hi ? "opacity:1;background:var(--whi)" : ""}"></i></span><span class="w-bar-v">${esc(r.t)}</span></div>`).join("")}</div>`;
}
function wMonthsSVG(ys, fg, hi) {
  const per = ys.per, W = 360, H = 130, gw = W / 12, max = Math.max(...per.map(p => p.spent), 1);
  let g = "";
  per.forEach((p, i) => {
    const h = p.spent / max * (H - 26), x = i * gw + 4, w = gw - 8, isHi = ys.bigMonth && p.mk === ys.bigMonth.mk, isLo = ys.lowMonth && p.mk === ys.lowMonth.mk;
    if (p.spent > 0) g += `<path d="${barPath(x, H - 18 - h, w, h, 4)}" fill="${isHi ? hi : fg}" opacity="${isHi || isLo ? 1 : 0.45}"/>`;
    g += `<text x="${x + w / 2}" y="${H - 3}" text-anchor="middle" fill="${fg}" opacity=".75" font-size="10" font-family="IBM Plex Mono, monospace">${esc(monthShort(p.mk).slice(0, 1))}</text>`;
  });
  return `<svg class="w-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending by month">${g}</svg>`;
}
function buildWrapped(y) {
  const ys = yearStats(y), s = [];
  const so = ys.soFar ? " so far" : "";
  s.push(wSlide("night", `<div class="w-eyebrow">Runway Wrapped</div><div class="w-head">Your ${y}${so},<br>in rupees.</div><div class="w-sub">${ys.tracked.length} ${ys.tracked.length === 1 ? "month" : "months"}, ${ys.count.toLocaleString(LOCALE)} purchases. Tap anywhere to begin.</div><div class="w-mark" aria-hidden="true"></div>`));
  s.push(wSlide("marigold", `<div class="w-eyebrow">This year you spent</div><div class="w-big">${esc(moneyBig(ys.spent))}</div><div class="w-sub">That's about <b>${esc(money(ys.spent / Math.max(1, ys.days)))}</b> a day, across ${ys.count.toLocaleString(LOCALE)} purchases.</div>`));
  if (ys.income > 0) s.push(wSlide("peacock", `<div class="w-eyebrow">And you kept</div><div class="w-big">${esc(moneyBig(ys.saved))}</div><div class="w-sub">${ys.saved >= 0 ? `That's <b>${Math.round(ys.rate * 100)}%</b> of everything that came in.` : "You spent more than you earned this year."}${ys.invested > 0 ? ` <b>${esc(moneyBig(ys.invested))}</b> of it went into SIPs and investments.` : ""}</div>
    <div class="w-split"><i style="width:${Math.min(100, Math.max(0, ys.spent / ys.income * 100)).toFixed(1)}%"></i></div><div class="w-split-l"><span>Spent</span><span>Saved</span></div>`));
  if (ys.cats.length) { const top = ys.cats[0]; s.push(wSlide("indigo", `<div class="w-eyebrow">Where it went</div><div class="w-head">${esc(top.name)} took the biggest share.</div>${wBars(ys.cats.slice(0, 5).map((c, i) => ({ l: c.name, v: c.v, t: moneyBig(c.v), hi: i === 0 })))}`)); }
  if (ys.topCount && ys.topCount.n >= 3) s.push(wSlide("rani", `<div class="w-eyebrow">Your most-visited</div><div class="w-head">${esc(ys.topCount.name)}</div><div class="w-big">${ys.topCount.n}<span class="w-unit"> times</span></div><div class="w-sub"><b>${esc(moneyBig(ys.topCount.total))}</b> in total, about ${esc(money(ys.topCount.total / ys.topCount.n))} each time.</div>`));
  if (ys.delivery.n >= 5) s.push(wSlide("vermilion", `<div class="w-eyebrow">Delivered to your door</div><div class="w-head">Swiggy and Zomato brought you</div><div class="w-big">${ys.delivery.n}<span class="w-unit"> orders</span></div><div class="w-sub">${esc(moneyBig(ys.delivery.total))} on delivery. That's an order every ${Math.max(1, Math.round(ys.days / ys.delivery.n))} days, at ${esc(money(ys.delivery.total / ys.delivery.n))} a time.</div>`));
  if (ys.tracked.length >= 2 && ys.bigMonth) s.push(wSlide("leaf", `<div class="w-eyebrow">Month by month</div><div class="w-head">${esc(monthLong(ys.bigMonth.mk))} was your biggest month.</div>${wMonthsSVG(ys, W_COLORS.leaf[1], W_COLORS.leaf[2])}<div class="w-sub">${esc(moneyBig(ys.bigMonth.spent))} in ${esc(monthLong(ys.bigMonth.mk))}. Your lightest was ${esc(monthLong(ys.lowMonth.mk))} at ${esc(moneyBig(ys.lowMonth.spent))}.</div>`));
  const wdTop = ys.wd.map((w, i) => ({ ...w, i })).sort((a, b) => b.v - a.v)[0];

  const m = imp.map, out = [];
  for (const r of imp.rows) {
    const date = parseDate(r[m.date], imp.dfmt); const desc = String(r[m.desc] ?? "").trim().replace(/\s+/g, " ");
    let v;
    if (m.mode === "single") { v = parseAmt(r[m.amount]); if (isNaN(v)) continue; if (imp.sign === "pos") v = -v; }
    else { const db = Math.abs(parseAmt(r[m.debit]) || 0), cr = Math.abs(parseAmt(r[m.credit]) || 0); v = cr - db; if (!db && !cr) continue; }
    if (!date || !desc || !v) continue;
    const type = v < 0 ? "expense" : "income";
    if (type === "income" && !imp.income) continue;
    const s = type === "expense" ? suggest(desc) : { cat: "" };
    out.push(normalizeTx({ id: newId(), date, desc, amount: Math.abs(v), type, cat: s.cat, auto: true }));
  }
  const seen = new Set(Object.values(S.months).flat().map(t => `${t.date}|${t.amount.toFixed(2)}|${t.desc.toLowerCase()}`));
  const fresh = [], dupes = [];
  for (const t of out) { const k = `${t.date}|${t.amount.toFixed(2)}|${t.desc.toLowerCase()}`; (seen.has(k) ? dupes : fresh).push(t); seen.add(k); }
  return { fresh, dupes };
}
function renderImportMap() {
  const m = imp.map, opts = sel => imp.head.map((h, i) => `<option value="${i}"${i === sel ? " selected" : ""}>${esc(h)}</option>`).join("");
  const { fresh, dupes } = importParsed();
  const exp = fresh.filter(t => t.type === "expense"), unmatched = exp.filter(t => t.cat === "other").length;
  $("#importBody").innerHTML = `<div class="dlg-h"><h2>Check the columns</h2><button class="btn ghost sm" data-close>Close</button></div>
    <div class="settings-row">
      <label class="field">Date column<select class="in" id="imDate">${opts(m.date)}</select></label>
      <label class="field">Narration / description<select class="in" id="imDesc">${opts(m.desc)}</select></label>
      <label class="field">Date format<select class="in" id="imDfmt"><option value="dmy"${imp.dfmt === "dmy" ? " selected" : ""}>Day first (03/10/2026)</option><option value="mdy"${imp.dfmt === "mdy" ? " selected" : ""}>Month first (10/03/2026)</option></select></label>
    </div>
    <div class="settings-row">
      <label class="field">Amounts are in<select class="in" id="imMode"><option value="split"${m.mode === "split" ? " selected" : ""}>Separate withdrawal & deposit columns</option><option value="single"${m.mode === "single" ? " selected" : ""}>One amount column</option></select></label>
      ${m.mode === "single" ? `<label class="field">Amount column<select class="in" id="imAmt">${opts(m.amount)}</select></label>
      <label class="field">Spending shows as<select class="in" id="imSign"><option value="neg"${imp.sign === "neg" ? " selected" : ""}>Negative numbers (−386.00)</option><option value="pos"${imp.sign === "pos" ? " selected" : ""}>Positive numbers (386.00)</option></select></label>`
      : `<label class="field">Withdrawal (money out)<select class="in" id="imDeb">${opts(m.debit)}</select></label><label class="field">Deposit (money in)<select class="in" id="imCred">${opts(m.credit)}</select></label>`}
    </div>
    <label class="switch"><input type="checkbox" id="imInc"${imp.income ? " checked" : ""}>Import money coming in (salary, refunds) as income</label>
    <div class="scroll-x"><table class="preview"><thead><tr><th>Date</th><th>Paid to</th><th>Category</th><th style="text-align:right">Amount</th></tr></thead><tbody>
      ${fresh.slice(0, 8).map(t => `<tr><td>${esc(t.date)}</td><td>${esc(prettyMerchant(t.desc))}</td><td>${t.type === "income" ? "Income" : esc(catName(t.cat))}</td><td class="r">${t.type === "income" ? "+" : "−"}${esc(money(t.amount, { cents: true }))}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No rows could be read with these settings. Try another column.</td></tr>`}
    </tbody></table></div>
    <p class="muted" style="margin:0;font-size:.88rem">${fresh.length} new: ${exp.length} payments and ${fresh.length - exp.length} income${dupes.length ? `, ${dupes.length} already imported and skipped` : ""}. ${exp.length ? `${exp.length - unmatched} sorted automatically${unmatched ? `, ${unmatched} go to Other for you to sort` : ""}.` : ""}</p>
    <div class="dlg-f"><button class="btn ghost" id="imBack">Choose another file</button><button class="btn primary" id="imGo"${fresh.length ? "" : " disabled"}>Import ${fresh.length} transactions</button></div>`;
  const re = () => {
    m.date = +$("#imDate").value; m.desc = +$("#imDesc").value; imp.dfmt = $("#imDfmt").value; imp.income = $("#imInc").checked;
    const mode = $("#imMode").value;
    if (mode !== m.mode) { m.mode = mode; if (mode === "split") { if (m.debit < 0) m.debit = 0; if (m.credit < 0) m.credit = 0; } else if (m.amount < 0) m.amount = 0; }
    else if (mode === "single") { m.amount = +$("#imAmt").value; imp.sign = $("#imSign").value; } else { m.debit = +$("#imDeb").value; m.credit = +$("#imCred").value; }
    renderImportMap();
  };
  $("#importBody").querySelectorAll("select,input[type=checkbox]").forEach(el => el.onchange = re);
  $("#imBack").onclick = renderImportPick;
  $("#imGo").onclick = () => {
    const { fresh } = importParsed(); const touched = new Set();
    for (const t of fresh) { const mk = mkOf(t.date); (S.months[mk] = S.months[mk] || []).push(t); touched.add(mk); }
    touched.forEach(mk => { S.months[mk].sort((a, b) => a.date.localeCompare(b.date)); persist("m-" + mk); });
    $("#importDialog").close();
    const latest = [...touched].sort().pop(); if (latest) S.txMonth = latest > curMK() ? curMK() : latest;
    S.tab = "tx"; render();
    toast(`Imported ${fresh.length} transactions across ${touched.size} ${touched.size === 1 ? "month" : "months"}.`);
  };
}
async function exportCSV() {
  const rows = [["Date", "Description", "Paid to", "Category", "Type", "Amount (INR)", "Note"]];
  Object.values(S.months).flat().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, t.desc, prettyMerchant(t.desc), t.type === "income" ? "Income" : catName(t.cat), t.type, (t.type === "income" ? t.amount : -t.amount).toFixed(2), t.note]));
  const csv = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n");
  saveFile(`runway-transactions-${todayISO()}.csv`, "\ufeff" + csv, "text/csv");
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", e => {
  if (!$("#wrapped").hidden) return;
  const tabBtn = e.target.closest(".tabs [data-tab], .bottom-tabs [data-tab]");
  if (tabBtn) { S.tab = tabBtn.dataset.tab; try { localStorage.setItem("runway.tab", S.tab); } catch {} render(); scrollTo({ top: 0 }); return; }
  const a = e.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action;
  if (act === "add") openTx(curMK(), null);
  else if (act === "edit") openTx(a.dataset.mk, a.dataset.id);
  else if (act === "go") { S.tab = a.dataset.tab; render(); scrollTo({ top: 0 }); }
  else if (act === "rev-prev") { S.reviewMonth = addMonths(S.reviewMonth, -1); render(); }
  else if (act === "rev-next") { S.reviewMonth = addMonths(S.reviewMonth, 1); render(); }
  else if (act === "tx-prev") { S.txMonth = addMonths(S.txMonth, -1); render(); }
  else if (act === "tx-next") { S.txMonth = addMonths(S.txMonth, 1); render(); }
  else if (act === "yr-prev" || act === "yr-next") { const ys = yearsWithData(), i = ys.indexOf(S.year) + (act === "yr-prev" ? -1 : 1); if (ys[i]) { S.year = ys[i]; render(); } }
  else if (act === "wrapped") openWrapped(+a.dataset.year);
  else if (act === "import") openImport();
  else if (act === "export") exportCSV();
  else if (act === "setup") openSetup(false);
  else if (act === "backup") downloadBackup();
  else if (act === "restore") {
    if (!S.demo && !a.classList.contains("armed")) { a.classList.add("armed", "danger"); a.textContent = "Replaces this device's data. Tap again"; setTimeout(() => { if (a.isConnected) { a.classList.remove("armed", "danger"); a.textContent = "Restore from backup"; } }, 5000); return; }
    $("#restoreFile").click();
  }
  else if (act === "addcat") {
    const id = "c" + newId().slice(0, 6);
    S.settings.categories.splice(S.settings.categories.length - 1, 0, { id, name: "New category", budget: 0, kind: "everyday", keywords: [] });
    kwIndex = null; persist("settings"); render(); const el = document.getElementById("cn-" + id); if (el) { el.focus(); el.select(); }
  }
  else if (act === "delcat") {
    if (!a.classList.contains("armed")) { a.classList.add("armed", "danger"); a.textContent = "Tap to confirm"; setTimeout(() => { if (a.isConnected) { a.classList.remove("armed", "danger"); a.textContent = "Remove"; } }, 4000); return; }
    const id = a.dataset.cat; const touched = new Set();
    for (const [mk, list] of Object.entries(S.months)) for (const t of list) if (t.cat === id) { t.cat = "other"; t.auto = true; touched.add(mk); }
    S.settings.categories = S.settings.categories.filter(c => c.id !== id);
    for (const k of Object.keys(S.settings.rules)) if (S.settings.rules[k] === id) delete S.settings.rules[k];
    kwIndex = null; persist("settings"); touched.forEach(mk => persist("m-" + mk)); render();
    toast(`Category removed.${touched.size ? " Its transactions moved to Other." : ""}`);
  }
  else if (act === "reset") {
    if (!a.classList.contains("armed")) { a.classList.add("armed"); a.textContent = "Tap again to erase everything"; setTimeout(() => { if (a.isConnected) { a.classList.remove("armed"); a.textContent = "Erase all my data"; } }, 5000); return; }
    eraseAll();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "restoreFile") { if (t.files[0]) restoreBackup(t.files[0]); t.value = ""; return; }
  if (t.classList.contains("catpick")) { recategorize(t.dataset.mk, t.dataset.id, t.value); return; }
  if (t.id === "txCat") { S.txCat = t.value; $("#txList").innerHTML = txListHTML(); return; }
  if (t.dataset.setting) { S.settings[t.dataset.setting] = Math.max(0, parseAmt(t.value) || 0); persist("settings"); $("#planSummary").innerHTML = planSummaryHTML(); return; }
  if (t.dataset.cat && t.dataset.field) {
    const c = catById(t.dataset.cat); if (!c) return; const f = t.dataset.field;
    if (f === "name") c.name = t.value.trim() || "Untitled";
    else if (f === "budget") c.budget = Math.max(0, parseAmt(t.value) || 0);
    else if (f === "kind") c.kind = KINDS[t.value] ? t.value : "everyday";
    else if (f === "keywords") { c.keywords = t.value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean); kwIndex = null; }
    persist("settings"); $("#planSummary").innerHTML = planSummaryHTML();
  }
});
let searchT;
document.addEventListener("input", e => {
  if (e.target.id === "txSearch") { S.txSearch = e.target.value; clearTimeout(searchT); searchT = setTimeout(() => { const l = $("#txList"); if (l) l.innerHTML = txListHTML(); }, 120); }
});

/* ============================================================
   Boot
   ============================================================ */
buildDemo();
initStore();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
