<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Runway</title>
<meta name="description" content="A private rupee budget and expense tracker: daily safe-to-spend, auto-sorted UPI payments, monthly reviews and a year-end Wrapped. Your data stays on your device.">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
.callout-card{display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap;background:var(--accent-wash);border-color:transparent;box-shadow:none;padding:14px 18px}
.callout-card p{margin:0;flex:1 1 320px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-h > div{display:grid;gap:2px}
.sec-h h2{font-size:1.45rem}
.m3-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:760px){.m3-cards{grid-template-columns:1fr}}
.m3-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.m3-card.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.m3-top{display:flex;align-items:center;gap:8px}
.m3-top i,.m3 th i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.m3 th i{margin-right:6px;vertical-align:-1px}
.m3-card > b{font-family:var(--f-display);font-size:1.6rem;font-weight:650;letter-spacing:-.02em}
.m3-sub{font-size:.82rem;color:var(--muted)}
.m3-card dl{margin:8px 0 0;display:grid;gap:4px}
.m3-card dl div{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;border-top:1px solid var(--line);padding-top:4px}
.m3-card dt{color:var(--ink-2)}.m3-card dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.m3-wrap{border:0;border-radius:0}
table.m3{border-collapse:collapse;width:100%;font-size:.88rem;min-width:640px}
table.m3 th,table.m3 td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.m3 th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
table.m3 .r{text-align:right;font-variant-numeric:tabular-nums}
table.m3 td.cur{background:var(--accent-wash)}
table.m3 tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--line-strong)}
table.m3 .bud{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
.m3-foot{display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap;margin-top:14px}
.m3-foot p{margin:0;flex:1 1 300px;font-size:.88rem}
.li.reg{grid-template-columns:minmax(0,1fr) auto auto}
.li.reg .c{grid-column:1 / 3}
.li.reg .pill{grid-column:3;grid-row:1 / span 2;align-self:center}
.two-col-list{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
@media (max-width:700px){.two-col-list{grid-template-columns:1fr}}
.imp-months{display:flex;flex-wrap:wrap;gap:8px}
.imp-months div{display:grid;font-size:.82rem;background:var(--surface-2);border-radius:10px;padding:6px 10px}
.imp-months span{color:var(--ink-2)}
.kvs{display:grid}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:2px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv > span:first-child{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;grid-row:span 2}
.kv b{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv .muted{font-size:.84rem;grid-column:2}
.kv .btn{grid-column:3;grid-row:1 / span 2}
@media (max-width:640px){.kv{grid-template-columns:minmax(0,1fr)}.kv > span:first-child{grid-row:auto}.kv .muted{grid-column:1}.kv .btn{grid-column:1;grid-row:auto;justify-self:start;margin-top:6px}}
.imp-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.imp-sum div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.imp-sum div.hi{border-color:var(--accent);background:var(--accent-wash)}
.imp-sum span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.imp-sum b{font-family:var(--f-display);font-size:1.5rem;font-weight:650}
.imp-sum i{font-style:normal;font-size:.8rem;color:var(--ink-2)}
@media (max-width:520px){.imp-sum{grid-template-columns:1fr}}
.matches{display:grid;gap:6px;padding:12px 14px;border-radius:12px;background:var(--warn-wash);font-size:.88rem}
.matches .switch{white-space:normal;align-items:flex-start;color:var(--ink)}
.cols{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.cols summary{cursor:pointer;font-size:.85rem;color:var(--ink-2);font-weight:600}
.imp-tabs{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;justify-self:start}
.imp-tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.imp-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.imp-tabs b{font-variant-numeric:tabular-nums;font-size:.8rem;background:var(--surface-2);border-radius:999px;padding:0 7px}
.imp-list{max-height:min(52vh,460px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 10px}
.imp-cat{display:inline-flex;gap:6px;align-items:center}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tag.warn{color:var(--warn-ink)}
@media (max-width:560px){.imp-cat{grid-row:2;justify-self:start}}
</style>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: app shell — sticky header with tabs (bottom tab bar on phones), one scrolling work area of cards in a 12-col grid. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eaeef3; --ink:#111821; --ink-2:#4a5563; --muted:#7a8492;
  --line:#dde3ea; --line-strong:#c4ccd6;
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-wash:rgba(42,120,214,.10); --on-accent:#ffffff;
  --s-last:#a3acb7; --s-area:rgba(42,120,214,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --good-ink:#1a7a2a; --good-wash:rgba(12,163,12,.10);
  --warn:#fab219; --warn-ink:#8a5a00; --warn-wash:rgba(250,178,25,.16);
  --bad:#d03b3b; --bad-ink:#b42828; --bad-wash:rgba(208,59,59,.10);
  --shadow:0 1px 2px rgba(17,24,33,.05),0 4px 16px rgba(17,24,33,.05);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1116; --surface:#161b22; --surface-2:#1e252e; --ink:#eef2f6; --ink-2:#b3bdc8; --muted:#848e9a;
    --line:#29313b; --line-strong:#3a434f;
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:rgba(57,135,229,.16); --on-accent:#ffffff;
    --s-last:#5d6773; --s-area:rgba(57,135,229,.16);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#0ca30c; --good-ink:#4cc75a; --good-wash:rgba(12,163,12,.16);
    --warn:#fab219; --warn-ink:#f5c04a; --warn-wash:rgba(250,178,25,.14);
    --bad:#d03b3b; --bad-ink:#f07a7a; --bad-wash:rgba(208,59,59,.18);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1116; --surface:#161b22; --surface-2:#1e252e; --ink:#eef2f6; --ink-2:#b3bdc8; --muted:#848e9a;
  --line:#29313b; --line-strong:#3a434f;
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-wash:rgba(57,135,229,.16); --on-accent:#ffffff;
  --s-last:#5d6773; --s-area:rgba(57,135,229,.16);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --good-ink:#4cc75a; --good-wash:rgba(12,163,12,.16);
  --warn:#fab219; --warn-ink:#f5c04a; --warn-wash:rgba(250,178,25,.14);
  --bad:#d03b3b; --bad-ink:#f07a7a; --bad-wash:rgba(208,59,59,.18);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.2);
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--f-body);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ink);position:relative;flex:none}
.mark::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;background:repeating-linear-gradient(to bottom,var(--bg) 0 3px,transparent 3px 6px)}
.tabs{display:flex;gap:4px;flex:1}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--ink-2);font-weight:600;cursor:pointer}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.top-actions{display:flex;align-items:center;gap:10px}
.save-state{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.save-state[data-s="db"]::before,.save-state[data-s="local"]::before{background:var(--good)}
.save-state[data-s="demo"]::before{background:var(--warn)}
.save-state[data-s="busy"]::before{background:var(--accent)}
.bottom-tabs{display:none}

main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.banner{max-width:1180px;margin:16px auto 0;padding:0 20px}
.banner-in{background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:var(--r);padding:12px 16px;display:flex;gap:12px 18px;align-items:center;flex-wrap:wrap}
.banner-in p{margin:0;flex:1 1 320px;color:var(--ink)}
.banner-in strong{font-weight:700}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-wash)}
label.field{display:grid;gap:5px;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.money-in{position:relative}
.money-in span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.95rem}
.money-in .in{padding-left:calc(14px + var(--sym-w,0.7em))}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- cards & grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h .sub{font-size:.84rem;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
@media (max-width:960px){.stack{gap:14px}.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:span 12}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:1fr;gap:20px}}
.hero-fig{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
.hero-fig .big{font-family:var(--f-display);font-size:clamp(2.8rem,7vw,4.4rem);font-weight:700;letter-spacing:-.035em;line-height:1}
.hero-fig .unit{font-family:var(--f-display);font-size:1.3rem;color:var(--ink-2);font-weight:600}
.hero p{margin:0;color:var(--ink-2);max-width:56ch}
.hero p + p{margin-top:8px}
.hero strong{color:var(--ink)}
.strip{display:grid;gap:14px}
.strip-row{display:grid;gap:6px}
.strip-lab{display:flex;justify-content:space-between;font-size:.84rem;color:var(--ink-2);gap:10px}
.strip-lab b{color:var(--ink);font-weight:600}
.track{height:12px;border-radius:999px;background:var(--surface-2);position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink-2)}
.track.time i{background:var(--s-last)}
.track.spend i{background:var(--accent)}
.track.spend.warn i{background:var(--warn)}
.track.spend.bad i{background:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-wash);color:var(--good-ink)}
.pill.warn{background:var(--warn-wash);color:var(--warn-ink)}
.pill.bad{background:var(--bad-wash);color:var(--bad-ink)}
.pill.bad::before{border-radius:2px}
.pill.warn::before{border-radius:2px;transform:rotate(45deg);width:7px;height:7px}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}

/* ---------- KPI tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;align-content:start}
.kpi .v{font-family:var(--f-display);font-size:1.65rem;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.kpi .s{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.delta{font-weight:700;font-size:.8rem}
.delta.up{color:var(--bad-ink)}.delta.down{color:var(--good-ink)}
.delta.good{color:var(--good-ink)}.delta.bad{color:var(--bad-ink)}

/* ---------- charts ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-data);font-size:11px;fill:var(--muted)}
.chart .lab{font-family:var(--f-body);font-size:12px;fill:var(--ink-2);font-weight:600}
.chart .lab-v{font-family:var(--f-body);font-size:12px;fill:var(--ink)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent)}
.legend i.last{border-color:var(--s-last)}
.legend i.proj{border-top-style:dashed}
.legend i.plan{border-top:1.5px dashed var(--ink-2)}
.legend i.box{width:12px;height:12px;border:0;border-radius:3px;background:var(--accent)}
.legend i.tick{width:14px;border-top:3px solid var(--ink)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:.8rem;line-height:1.45;max-width:260px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.tip b{display:block;font-weight:700;margin-bottom:2px}
.tip .row{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}

/* ---------- category budget rows ---------- */
.cats{display:grid;gap:14px}
.cat-group{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:6px;border-top:1px solid var(--line)}
.cat-group:first-child{border-top:0;padding-top:0}
.crow{display:grid;gap:6px}
.crow-top{display:flex;align-items:center;gap:10px;font-size:.92rem}
.crow-top .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-top .amt{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:.86rem;white-space:nowrap}
.crow-top .amt b{color:var(--ink);font-weight:600}
.cbar{height:8px;border-radius:999px;background:var(--surface-2);position:relative}
.cbar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent);max-width:100%}
.cbar.warn i{background:var(--warn)}
.cbar.bad i{background:var(--bad)}
.cbar.done i{background:var(--ink-2)}
.cbar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px;box-shadow:0 0 0 2px var(--surface)}
.crow-foot{font-size:.78rem;color:var(--muted)}

/* review bars */
.rbars{display:grid;gap:10px}
.rbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 86px 74px;align-items:center;gap:12px;font-size:.88rem;cursor:default;padding:2px 0}
.rbar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .v{text-align:right;font-variant-numeric:tabular-nums}
.rbar .dl{text-align:right}
.rtrack{height:14px;position:relative}
.rtrack i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--accent)}
.rtrack i.over{background:var(--bad)}
.rtrack .bm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
@media (max-width:560px){.rbar{grid-template-columns:minmax(0,1fr) 78px 64px}.rbar .rtrack{grid-column:1 / -1;grid-row:2}}

/* ---------- transactions ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1 1 200px}
.monthnav{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:2px}
.monthnav button{border:0;background:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.1rem;color:var(--ink-2)}
.monthnav button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}

.monthnav span{min-width:128px;text-align:center;font-weight:600;font-size:.92rem}
.txday{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:14px 4px 6px;border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}

.tx-main:hover .tx-desc{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.tx-desc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:84px}
.tx-amt.pos{color:var(--good-ink)}
.catpick{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 26px 4px 11px;font-size:.8rem;font-weight:600;color:var(--ink-2);cursor:pointer;max-width:170px;text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 9px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.catpick:hover{border-color:var(--line-strong);color:var(--ink)}
.catpick.unsorted{background-color:var(--warn-wash);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn-ink)}
.chip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--good-wash);color:var(--good-ink)}
@media (max-width:560px){.tx{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.tx .catpick,.tx .chip{grid-row:2;justify-self:start}.tx-amt{grid-row:1;grid-column:2}}
.callout{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--accent-wash);margin-bottom:14px;font-size:.9rem}
.callout p{margin:0;flex:1 1 260px}

.empty{padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:1.1rem;margin-bottom:6px;color:var(--ink)}
.empty p{margin:0 auto 14px;max-width:46ch}

/* lists */
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.li:last-child{border-bottom:0}
.li .a{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.li .c{font-size:.78rem;color:var(--muted);grid-column:1 / -1}
.summary-line{font-size:1.08rem;color:var(--ink-2);max-width:70ch;margin:0}

/* ---------- budget editor ---------- */
.plan-eq{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;font-size:.95rem}
.plan-eq .t{display:grid}
.plan-eq .t span{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.plan-eq .t b{font-family:var(--f-display);font-size:1.5rem;font-weight:650;letter-spacing:-.02em}
.plan-eq .op{font-family:var(--f-display);font-size:1.4rem;color:var(--muted)}
.settings-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:700px){.settings-row{grid-template-columns:1fr}}
.cat-edit{display:grid;grid-template-columns:minmax(0,1.2fr) 130px 150px minmax(0,2fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cat-edit:last-child{border-bottom:0}
.cat-edit-h{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-bottom:6px;border-bottom:1px solid var(--line)}
@media (max-width:820px){.cat-edit{grid-template-columns:minmax(0,1fr) 120px}.cat-edit .kw{grid-column:1 / -1;order:5}.cat-edit-h{display:none}}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:.84rem;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.switch input{width:16px;height:16px;accent-color:var(--accent)}

/* ---------- dialogs ---------- */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}

dialog::backdrop{background:rgba(10,14,20,.45)}

.dlg-f{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:10px}

.setup-cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;max-height:300px;overflow:auto;padding-right:4px}
@media (max-width:480px){.setup-cats{grid-template-columns:1fr}}
.setup-cats label{display:grid;grid-template-columns:minmax(0,1fr) 110px;align-items:center;gap:10px;font-size:.88rem}
.drop{border:1.5px dashed var(--line-strong);border-radius:12px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.9rem;max-width:min(560px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:720px){
  .tabs{display:none}
  .top-in{padding:10px 16px;gap:12px}

  .save-state{display:none}
  main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .banner{padding:0 16px}
  .bottom-tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom-tabs button{border:0;background:none;padding:8px 2px;font-size:.72rem;font-weight:600;color:var(--muted);border-radius:10px;cursor:pointer}
  .bottom-tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface-2)}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .grid{gap:14px}.kpis{gap:12px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:no-preference){
  .track i,.cbar i,.rtrack i{transition:width .5s cubic-bezier(.2,.7,.2,1)}
}

/* ---------- India / year additions ---------- */
.cbar.save i{background:var(--good)}
.settings-row.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.settings-row.two-col{grid-template-columns:1fr}}
.wrap-cta{display:flex;gap:16px 28px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#141414;color:#fbf3e4;border-color:#141414;background-image:radial-gradient(rgba(246,162,26,.16) 1.3px,transparent 1.5px);background-size:20px 20px}
.wrap-cta > div{display:grid;gap:4px;flex:1 1 320px}
.wrap-cta .eyebrow{color:#f6a21a}
.wrap-cta h2{font-size:1.45rem;color:#fbf3e4}
.wrap-cta p{margin:0;color:rgba(251,243,228,.75);max-width:60ch}
.wrap-cta .btn.primary{background:#f6a21a;border-color:#f6a21a;color:#1d1305}

/* ---------- Wrapped (its own visual world: festive colour fields) ---------- */
.wrapped{position:fixed;inset:0;z-index:90;background:rgba(8,8,10,.92);display:grid;place-items:center;padding:max(12px,env(safe-area-inset-top,0px)) 12px max(12px,env(safe-area-inset-bottom,0px))}
.w-stage{position:relative;width:min(440px,100%);height:min(800px,100%);border-radius:24px;overflow:hidden;background:var(--wbg);color:var(--wfg);cursor:pointer;user-select:none;-webkit-user-select:none;outline:none;box-shadow:0 30px 80px rgba(0,0,0,.5);transition:background-color .45s ease,color .45s ease}
.w-stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--wfg) 16%,transparent) 1.4px,transparent 1.7px);background-size:22px 22px;-webkit-mask-image:linear-gradient(165deg,#000 0%,transparent 50%);mask-image:linear-gradient(165deg,#000 0%,transparent 50%);pointer-events:none}
@media (max-width:520px){.wrapped{padding:0}.w-stage{width:100%;height:100%;border-radius:0}}
.w-prog{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;right:58px;display:flex;gap:4px;z-index:3}
.w-prog span{flex:1;height:3px;border-radius:2px;background:var(--wfg);opacity:.25}
.w-prog span.done,.w-prog span.on{opacity:1}
.w-close{position:absolute;top:calc(2px + env(safe-area-inset-top,0px));right:8px;z-index:4;border:0;background:none;color:var(--wfg);font-size:30px;line-height:1;width:44px;height:44px;cursor:pointer}
.w-slide-wrap{position:absolute;inset:0;padding:70px 30px 78px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.w-slide{display:flex;flex-direction:column;gap:16px}
.w-eyebrow{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.w-head{font-family:var(--f-display);font-size:clamp(28px,7.6vw,36px);font-weight:700;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.w-big{font-family:var(--f-display);font-size:clamp(58px,17vw,90px);font-weight:700;line-height:.95;letter-spacing:-.045em;color:var(--whi);font-variant-numeric:tabular-nums}
.w-unit{font-size:.34em;letter-spacing:-.01em;margin-left:6px;color:var(--wfg)}
.w-sub{font-size:18px;line-height:1.45;max-width:34ch}
.w-sub b{font-weight:700}
.w-bars{display:grid;gap:12px}
.w-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;font-size:15px}
.w-bar-l{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-bar-v{font-weight:700;font-variant-numeric:tabular-nums}
.w-bar-t{grid-column:1 / -1;height:9px;border-radius:5px;background:color-mix(in srgb,var(--wfg) 16%,transparent)}
.w-bar-t i{display:block;height:100%;border-radius:5px;background:var(--wfg);opacity:.55}
.w-split{height:16px;border-radius:8px;background:var(--whi);overflow:hidden}
.w-split i{display:block;height:100%;background:var(--wfg);opacity:.9}
.w-split-l{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.w-svg{width:100%;height:auto;display:block}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 16px}
.w-grid div{border-top:1px solid color-mix(in srgb,var(--wfg) 25%,transparent);padding-top:8px;display:grid;gap:2px;min-width:0}
.w-grid span{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.w-grid b{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.w-grid b.sm{font-size:19px}
.w-grid div:nth-child(2) b{color:var(--whi)}
.w-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.w-btn{border:1.5px solid var(--wfg);background:transparent;color:var(--wfg);border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.w-btn.solid{background:var(--whi);border-color:var(--whi);color:#141414}
.w-btn:focus-visible,.w-close:focus-visible{outline:2px solid var(--wfg);outline-offset:2px}
.w-nav{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;padding:0 14px;z-index:3;font-size:12px;font-weight:600}
.w-nav span{opacity:.75}
.w-nav .w-btn{width:42px;height:42px;padding:0;font-size:22px;border-color:color-mix(in srgb,var(--wfg) 35%,transparent)}
.w-mark{height:6px;width:132px;background:repeating-linear-gradient(90deg,var(--whi) 0 18px,transparent 18px 30px);margin-top:6px}
@media (prefers-reduced-motion:no-preference){
  .w-slide > *{animation:wrise .55s cubic-bezier(.2,.7,.2,1) both}
  .w-slide > *:nth-child(2){animation-delay:.07s}.w-slide > *:nth-child(3){animation-delay:.14s}.w-slide > *:nth-child(4){animation-delay:.21s}.w-slide > *:nth-child(5){animation-delay:.28s}
  .w-bar-t i,.w-split i{animation:wgrow .9s .2s cubic-bezier(.2,.7,.2,1) both;transform-origin:left}
}
@keyframes wrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes wgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>

<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="mark" aria-hidden="true"></span>Runway</div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="overview">This month</button>
      <button class="tab" role="tab" data-tab="review">3 months</button>
      <button class="tab" role="tab" data-tab="tx">Transactions</button>
      <button class="tab" role="tab" data-tab="year">Year</button>
      <button class="tab" role="tab" data-tab="budget">Budget</button>
    </nav>
    <div class="top-actions">
      <span class="save-state" id="saveState" data-s="demo">Example data</span>
      <button class="btn primary" id="addBtn" data-action="add">+ Add expense</button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="view" aria-live="polite"></main>
<nav class="bottom-tabs" aria-label="Sections">
  <button data-tab="overview">This month</button>
  <button data-tab="review">3 months</button>
  <button data-tab="tx">Transactions</button>
  <button data-tab="year">Year</button>
  <button data-tab="budget">Budget</button>
</nav>

<dialog id="txDialog"><form class="dlg" id="txForm" autocomplete="off">
  <div class="dlg-h"><h2 id="txTitle">Add expense</h2>
    <div class="seg" role="group" aria-label="Type"><button type="button" id="typeExp" aria-pressed="true">Expense</button><button type="button" id="typeInc" aria-pressed="false">Income</button></div>
  </div>
  <div class="amount-big"><label class="field">Amount<div class="money-in"><span class="sym">₹</span><input class="in num" id="fAmount" inputmode="decimal" placeholder="0" required></div></label></div>
  <label class="field">What was it?<input class="in" id="fDesc" placeholder="e.g. Swiggy, Blinkit, Rapido, Netflix" required></label>
  <div class="two">
    <label class="field" id="fCatWrap">Category<select class="in" id="fCat"></select><span class="hint" id="fCatHint"></span></label>
    <label class="field">Date<input class="in" type="date" id="fDate" required></label>
  </div>
  <label class="field">Note <span class="hint">(optional)</span><input class="in" id="fNote" placeholder="Anything to remember"></label>
  <div class="dlg-f">
    <button type="button" class="btn danger left" id="txDelete" hidden>Delete</button>
    <button type="button" class="btn ghost" data-close>Cancel</button>
    <button type="submit" class="btn primary" id="txSave">Save</button>
  </div>
</form></dialog>

<dialog id="importDialog" class="wide"><div class="dlg" id="importBody"></div></dialog>
<dialog id="setupDialog" class="wide"><form class="dlg" id="setupForm" autocomplete="off"></form></dialog>
<div class="wrapped" id="wrapped" hidden role="dialog" aria-modal="true" aria-label="Runway Wrapped">
  <div class="w-stage" id="wStage" tabindex="-1">
    <div class="w-prog" id="wProg"></div>
    <button class="w-close" data-w="close" aria-label="Close Wrapped">×</button>
    <div class="w-slide-wrap" id="wSlide" aria-live="polite"></div>
    <div class="w-nav"><button class="w-btn" data-w="prev" aria-label="Previous slide">‹</button><span id="wCount"></span><button class="w-btn" data-w="next" aria-label="Next slide">›</button></div>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* ============================================================
   Helpers (India: rupees, lakh/crore grouping, day-first dates)
   ============================================================ */
const LOCALE = "en-IN";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const clone = o => JSON.parse(JSON.stringify(o));
const sum = a => a.reduce((x, y) => x + y, 0);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const mkOf = iso => iso.slice(0, 7);
const curMK = () => mkOf(todayISO());
const curYear = () => +curMK().slice(0, 4);
function addMonths(mk, n) { let [y, m] = mk.split("-").map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; }
const daysIn = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const mDate = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m - 1, 1); };
const monthLong = mk => mDate(mk).toLocaleString(LOCALE, { month: "long" });
const monthShort = mk => mDate(mk).toLocaleString(LOCALE, { month: "short" });
const monthYear = mk => mDate(mk).toLocaleString(LOCALE, { month: "long", year: "numeric" });
const dateObj = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const dateNice = iso => dateObj(iso).toLocaleDateString(LOCALE, { weekday: "short", day: "numeric", month: "short" });
const dateLong = iso => dateObj(iso).toLocaleDateString(LOCALE, { day: "numeric", month: "long" });
const dayShort = (mk, d) => `${d} ${monthShort(mk)}`;
const newId = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MONTHS3 = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

const fmtCache = {};
function fmt(cents, compact) {
  const k = "" + cents + compact;
  if (!fmtCache[k]) fmtCache[k] = new Intl.NumberFormat(LOCALE, compact
    ? { style: "currency", currency: "INR", notation: "compact", minimumFractionDigits: 0, maximumFractionDigits: 1 }
    : { style: "currency", currency: "INR", minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 });
  return fmtCache[k];
}
function money(v, o = {}) {
  const hasPaise = Math.abs(v - Math.round(v)) > 0.004;
  const cents = (o.cents ?? Math.abs(v) < 100) && hasPaise;
  let s = fmt(!!cents, !!o.compact).format(Math.abs(v));
  if (v < -0.004) s = "−" + s; else if (o.sign && v > 0.004) s = "+" + s;
  return s;
}
const moneyBig = v => Math.abs(v) >= 100000 ? money(v, { compact: true }) : money(v);
const curSymbol = () => "₹";
function parseAmt(s) {
  if (typeof s === "number") return s;
  s = String(s || "").trim();
  if (!s) return NaN;

let kwIndex = null;
function buildKwIndex() {
  kwIndex = [];
  for (const c of S.settings.categories) for (const raw of c.keywords || []) {
    const kw = raw.trim().toLowerCase(); if (!kw) continue;
    const e = kw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp("(^|[^a-z0-9])" + e + (kw.length <= 4 ? "(?![a-z0-9])" : ""), "i");
    kwIndex.push({ re, len: kw.length, cat: c.id, kw });
  }
}
// "UPI-SWIGGY LIMITED-swiggy@axis-UTIB0000-6287..." or "UPI/DR/6287.../ZOMATO/HDFC/..." -> "Swiggy Limited" / "Zomato"
function prettyMerchant(desc) {
  let s = String(desc || "").trim().replace(/^(?:n?ach\s*(?:d|dr|db)?|ecs|bil|ib\s*billpay)\s*[-\/:]\s*/i, "");
  const m = s.match(/^(?:upi|imps|neft|rtgs|pos)\s*[-\/:]\s*(?:(?:p2m|p2a|dr|cr|in|out)\s*[-\/]\s*)?(?:\d{6,}\s*[-\/]\s*)?([^-\/@|]+)/i);
  if (m && /[a-z]/i.test(m[1])) s = m[1];
  s = s.replace(/\s+/g, " ").trim();
  if (s === s.toUpperCase()) s = s.toLowerCase().replace(/(^|[\s(&-])([a-z])/g, (_, a, b) => a + b.toUpperCase());
  return s.slice(0, 42) || "Untitled";
}
function merchantKey(desc) {
  let s = prettyMerchant(desc).toLowerCase();
  s = s.replace(/^(sq|tst|pp|paypal|bil|ach)\s*\*\s*/, "");
  s = s.replace(/\b(pos|debit|credit|purchase|card|visa|mastercard|rupay|ach|nach|pmt|payment|recurring|online|transfer|upi|imps|neft|ltd|limited|pvt|private|india|technologies)\b/g, " ");
  s = s.replace(/[#*][\w-]*/g, " ").replace(/\d+/g, " ").replace(/[^a-z&' ]/g, " ").replace(/\s+/g, " ").trim();
  return s.split(" ").filter(w => w.length > 1).slice(0, 2).join(" ");
}
function suggest(desc) {
  const key = merchantKey(desc);
  const rules = S.settings.rules || {};
  if (key && rules[key] && catById(rules[key])) return { cat: rules[key], why: "learned", kw: key };
  if (!kwIndex) buildKwIndex();
  let best = null;
  for (const k of kwIndex) if (k.re.test(desc) && (!best || k.len > best.len)) best = k;
  return best ? { cat: best.cat, why: "keyword", kw: best.kw } : { cat: "other", why: "none" };
}
const catById = id => S.settings.categories.find(c => c.id === id);
const catName = id => (catById(id) || catById("other") || { name: "Other" }).name;
const kindOf = id => (catById(id) || { kind: "everyday" }).kind;
function catOptions(sel) {

}

function normalizeSettings(s) {

    : clone(DEFAULT_CATS);

function normalizeTx(t) {
  const o = { id: String(t.id || newId()), date: String(t.date || todayISO()).slice(0, 10), desc: String(t.desc || ""), amount: Math.abs(+t.amount || 0), type: t.type === "income" ? "income" : "expense", cat: String(t.cat || "other"), auto: t.auto !== false, note: String(t.note || "") };

  if (t.fp) o.fp = String(t.fp);
  if (t.ref) o.ref = String(t.ref);
  return o;
}

/* ============================================================
   Storage: an on-device database (IndexedDB) plus a second copy in
   localStorage. Nothing is uploaded. A backup is one JSON "database
   file" that can be imported on any device to merge or restore.
   ============================================================ */
const store = { mode: "pending", idb: null, persisted: null, fileHandle: null, filePerm: null, fileName: "", lastFileWrite: null, dirty: false };
const LS_KEY = "runway.data.v2", LS_BACKUP = "runway.lastBackup";
const canLinkFile = typeof window.showSaveFilePicker === "function";
const isTouch = () => { try { return matchMedia("(pointer: coarse)").matches; } catch { return false; } };

function idbOpen() {
  return new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error("no indexedDB")); return; }
    const r = indexedDB.open("runway", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbReq(mode, fn) {
  return new Promise(res => {
    try {
      const tx = store.idb.transaction("kv", mode), q = fn(tx.objectStore("kv"));
      tx.oncomplete = () => res(mode === "readonly" ? (q.result ?? null) : true);
      tx.onerror = tx.onabort = () => res(mode === "readonly" ? null : false);
    } catch { res(mode === "readonly" ? null : false); }
  });
}
const idbGet = k => idbReq("readonly", s => s.get(k));
const idbPut = (k, v) => idbReq("readwrite", s => s.put(v, k));
const idbDel = k => idbReq("readwrite", s => s.delete(k));

function snapshot() { return { app: "runway", version: 3, savedAt: new Date().toISOString(), settings: S.settings, months: S.months }; }

function applySnapshot(d) { S.settings = normalizeSettings(d.settings); kwIndex = null; S.months = cleanMonths(d.months); S.demo = false; S.year = null; }
function lsGet() { try { const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function lsPut(snap) { try { localStorage.setItem(LS_KEY, JSON.stringify(snap)); return true; } catch { return false; } }
const txCount = () => Object.values(S.months).reduce((n, l) => n + l.length, 0);

async function initStore() {
  try { store.idb = await idbOpen(); } catch { store.idb = null; }
  const fromIdb = store.idb ? await idbGet("data") : null, fromLs = lsGet();
  const pick = [fromIdb, fromLs].filter(d => d && d.settings).sort((a, b) => String(b.savedAt || "").localeCompare(String(a.savedAt || "")))[0];
  const lsWorks = (() => { try { localStorage.setItem("runway.probe", "1"); localStorage.removeItem("runway.probe"); return true; } catch { return false; } })();
  store.mode = store.idb ? "idb" : lsWorks ? "local" : "none";
  if (pick) { applySnapshot(pick); if (store.idb && pick !== fromIdb) idbPut("data", pick); }
  if (store.idb) {
    const h = await idbGet("backupHandle");
    if (h && typeof h.queryPermission === "function") { store.fileHandle = h; store.fileName = h.name; store.filePerm = await queryPerm(h); }
  }
  try { if (navigator.storage && navigator.storage.persist) store.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist()); } catch {}
  S.loading = false; render();

function saveFile(filename, data, type) {

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const lastBackup = () => { try { return localStorage.getItem(LS_BACKUP); } catch { return null; } };

async function backupNow() {

}

// Laptop (Chrome / Edge): one file on disk that Runway rewrites after every change
async function queryPerm(h) { try { return await h.queryPermission({ mode: "readwrite" }); } catch { return "denied"; } }

    const h = await window.showSaveFilePicker({ suggestedName: "runway-database.json", types: [{ description: "Runway database", accept: { "application/json": [".json"] } }] });
    store.fileHandle = h; store.fileName = h.name; store.filePerm = "granted";
    if (store.idb) await idbPut("backupHandle", h);

    toast(`Auto-backup is on. Every change is saved to ${h.name}.`);
  } catch (e) { if (!e || e.name !== "AbortError") toast("Couldn't set up the backup file. Try a different folder."); }
}
async function resumeBackupFile() {
  try { store.filePerm = await store.fileHandle.requestPermission({ mode: "readwrite" }); } catch { store.filePerm = "denied"; }
  if (store.filePerm === "granted") { await writeBackupFile(); toast("Auto-backup resumed."); }

/* ============================================================
   Numbers: one month
   ============================================================ */
function stats(mk) {
  const tx = S.months[mk] || [];
  const n = daysIn(mk);
  const byCat = {}; S.settings.categories.forEach(c => byCat[c.id] = 0);
  const daily = new Array(n).fill(0);
  let spent = 0, income = 0, invested = 0, count = 0;
  for (const t of tx) {
    if (t.type === "income") { income += t.amount; continue; }
    const cid = byCat[t.cat] !== undefined ? t.cat : "other";
    byCat[cid] += t.amount;
    if (kindOf(cid) === "saving") { invested += t.amount; continue; }
    spent += t.amount; count++;
    const d = +t.date.slice(8, 10); if (d >= 1 && d <= n) daily[d - 1] += t.amount;
  }
  const cum = []; let a = 0; daily.forEach((v, i) => { a += v; cum[i] = a; });
  return { mk, tx, n, byCat, daily, cum, spent, income, invested, count };
}
const spendCats = () => S.settings.categories.filter(c => c.kind !== "saving");
const planCap = () => sum(spendCats().map(c => c.budget));
function outlook(mk) {
  const st = stats(mk), n = st.n;
  const isCur = mk === curMK();
  const d = isCur ? +todayISO().slice(8) : n;
  let fixedCommitted = 0, fixedDue = 0, flexSpent = 0, flexBudget = 0;
  for (const c of spendCats()) {
    const sp = st.byCat[c.id] || 0;
    if (c.kind === "fixed") { fixedCommitted += Math.max(c.budget, sp); fixedDue += Math.max(0, c.budget - sp); }
    else { flexSpent += sp; flexBudget += c.budget; }
  }
  const cap = planCap();
  const left = cap - fixedCommitted - flexSpent;
  const daysLeft = n - d + 1;
  const perDay = Math.max(0, left) / daysLeft;
  const K = Math.max(0, 10 - d);                // first ~10 days: blend actual pace with planned pace
  const rate = (flexSpent + (flexBudget / n) * K) / (d + K);
  const projected = isCur ? fixedCommitted + flexSpent + rate * (n - d) : st.spent;
  const income = Math.max(S.settings.income, st.income);
  const projSave = income - projected;
  let status = "ok";
  if (cap <= 0) status = "noplan"; else if (left < 0 || (projected > cap * 1.05 && (d >= 7 || !isCur))) status = "over"; else if (projected > cap) status = "tight";
  return { st, n, d, isCur, cap, left, daysLeft, perDay, projected, income, projSave, fixedCommitted, fixedDue, flexSpent, flexBudget, rate, status };
}

function yearStats(y) {

  const fest = pool.filter(p => +p.mk.slice(5) >= 10 && +p.mk.slice(5) <= 11), rest = pool.filter(p => !(+p.mk.slice(5) >= 10 && +p.mk.slice(5) <= 11));

    delivery: { n: delivery.length, total: sum(delivery.map(t => t.amount)) }, festAvg, restAvg, festN: fest.length, gifts: byCat.gifts || 0, soFar: y === curYear() };
}

/* ============================================================

const burnState = {};

  for (let v = 0; v <= ymax + 1e-6; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(money(v, { compact: true }))}</text>`;
  for (const t of [1, 8, 15, 22, n]) g += `<text x="${X(t - 0.5)}" y="${H - 8}" text-anchor="middle">${t === 1 ? esc(dayShort(mk, 1)) : t}</text>`;

  g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--ink-2)" stroke-dasharray="4 4" pointer-events="none"/><text class="lab" x="${W - mr}" y="${Y(avg) - 6}" text-anchor="end" pointer-events="none">Avg ${esc(money(avg))}/day</text>`;
  for (const t of [1, 8, 15, 22, n]) g += `<text x="${ml + (t - 0.5) * bw}" y="${H - 8}" text-anchor="middle">${t === 1 ? esc(dayShort(mk, 1)) : t}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Spending per day in ${esc(monthYear(mk))}">${g}</svg></div>`;
}

// spent bars + income ticks for a list of months
function monthsChart(mks, selMk, W = 680) {
  const data = mks.map(mk => { const st = stats(mk); return { mk, spent: st.spent, invested: st.invested, income: st.income || (st.count ? S.settings.income : 0) }; });
  const H = 230, ml = 54, mr = 12, mt = 14, mb = 30, k = mks.length;
  const max = Math.max(...data.map(d => Math.max(d.spent, d.income)), 1000) * 1.08, step = niceStep(max, 4), ymax = Math.ceil(max / step) * step;
  const gw = (W - ml - mr) / k, bw = Math.min(54, gw * 0.52), Y = v => H - mb - (v / ymax) * (H - mt - mb);
  let g = "";
  for (let v = 0; v <= ymax + 1e-6; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(money(v, { compact: true }))}</text>`;
  data.forEach((d, i) => {
    const cx = ml + gw * i + gw / 2, x = cx - bw / 2, sel = !selMk || d.mk === selMk;
    const tip = `<b>${esc(monthYear(d.mk))}</b><div class="row"><span>Spent</span><span>${esc(money(d.spent))}</span></div><div class="row"><span>Income</span><span>${esc(money(d.income))}</span></div>${d.invested ? `<div class="row"><span>Invested</span><span>${esc(money(d.invested))}</span></div>` : ""}<div class="row"><span>Saved</span><span>${esc(money(d.income - d.spent))}</span></div>`;
    g += `<g data-tiphtml="${esc(tip)}"><rect x="${ml + gw * i}" y="${mt}" width="${gw}" height="${H - mt - mb}" fill="transparent"/>`;
    if (d.spent > 0) g += `<path d="${barPath(x, Y(d.spent), bw, Y(0) - Y(d.spent), 4)}" fill="var(--accent)" opacity="${sel ? 1 : 0.55}"/>`;
    if (d.income > 0) g += `<line x1="${x - 5}" x2="${x + bw + 5}" y1="${Y(d.income)}" y2="${Y(d.income)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
    g += `<text x="${cx}" y="${H - 9}" text-anchor="middle" ${selMk && d.mk === selMk ? 'font-weight="700" style="fill:var(--ink)"' : ""}>${esc(monthShort(d.mk))}</text></g>`;
  });
  g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-strong)"/>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly spending and income">${g}</svg></div><div class="legend"><span><i class="box"></i>Spent</span><span><i class="tick"></i>Income</span></div>`;
}

/* ============================================================
   Views
   ============================================================ */
function statusPill(s) {
  return { ok: `<span class="pill good">On track</span>`, tight: `<span class="pill warn">Tight</span>`, over: `<span class="pill bad">Over plan</span>`, noplan: `<span class="pill neutral">No plan yet</span>` }[s];
}
function catRows(o) {
  const st = o.st, frac = o.d / o.n;
  const row = c => {
    const sp = st.byCat[c.id] || 0, b = c.budget, pct = b > 0 ? sp / b : (sp > 0 ? 1 : 0);
    let cls = "", chip = "", foot = "";
    if (c.kind === "saving") {
      if (b > 0 && sp >= b) chip = `<span class="pill good">Target reached</span>`;
      foot = b > 0 ? (sp >= b ? `${money(sp)} invested this month` : `${money(b - sp)} to go for your monthly target`) : `${money(sp)} invested`;
      cls = "save";
    } else if (c.kind === "fixed") {
      cls = sp >= b && b > 0 ? "done" : "";
      if (sp > b && b > 0) { cls = "bad"; chip = `<span class="pill bad">Over</span>`; foot = `${money(sp - b)} more than planned`; }
      else foot = b - sp > 0.5 ? `${money(b - sp)} still to pay` : "Paid";
    } else {
      if (sp > b) { cls = "bad"; chip = `<span class="pill bad">Over</span>`; foot = b > 0 ? `${money(sp - b)} over budget` : "No budget set"; }
      else if (o.isCur && b > 0 && pct > frac * 1.15 + 0.05) { cls = "warn"; chip = `<span class="pill warn">Ahead of pace</span>`; foot = `${money(b - sp)} left · ${money((b - sp) / o.daysLeft)}/day`; }
      else foot = b > 0 ? `${money(b - sp)} left${o.isCur ? ` · ${money((b - sp) / o.daysLeft)}/day` : ""}` : "No budget set";
    }
    const pace = c.kind === "everyday" && o.isCur && b > 0 ? `<span class="pace" style="left:calc(${(frac * 100).toFixed(1)}% - 1px)" title="Where you'd be at an even pace"></span>` : "";
    return `<div class="crow" data-tip="${esc(c.name)}|Spent ${esc(money(sp, { cents: true }))} of ${esc(money(b))}${c.kind === "everyday" && o.isCur && b > 0 ? "|Even pace by today: " + esc(money(b * frac)) : ""}">
      <div class="crow-top"><span class="name">${esc(c.name)}</span>${chip}<span class="amt"><b>${esc(money(sp))}</b> / ${esc(money(b))}</span></div>
      <div class="cbar ${cls}"><i style="width:${Math.min(100, pct * 100).toFixed(1)}%"></i>${pace}</div>
      <div class="crow-foot">${esc(foot)}</div></div>`;
  };
  const cats = S.settings.categories.filter(c => c.budget > 0 || (st.byCat[c.id] || 0) > 0);
  const flex = cats.filter(c => c.kind === "everyday").sort((a, b) => (st.byCat[b.id] || 0) / (b.budget || 1) - (st.byCat[a.id] || 0) / (a.budget || 1));
  const fixed = cats.filter(c => c.kind === "fixed"), saving = cats.filter(c => c.kind === "saving");
  return `<div class="cats"><div class="cat-group">Everyday spending</div>${flex.map(row).join("")}${fixed.length ? `<div class="cat-group">Fixed bills</div>${fixed.map(row).join("")}` : ""}${saving.length ? `<div class="cat-group">Savings & SIPs</div>${saving.map(row).join("")}` : ""}</div>`;
}

function txRow(t) {
  const inc = t.type === "income";
  const unsorted = !inc && t.cat === "other" && t.auto;
  const name = prettyMerchant(t.desc);
  return `<div class="tx">
    <button class="tx-main" data-action="edit" data-id="${esc(t.id)}" data-mk="${mkOf(t.date)}"><span class="tx-desc">${esc(name)}</span><span class="tx-meta">${esc(dateNice(t.date))}${t.note ? " · " + esc(t.note) : ""}${name !== t.desc ? " · " + esc(t.desc) : ""}</span></button>
    ${inc ? `<span class="chip">Income</span>` : `<select class="catpick${unsorted ? " unsorted" : ""}" id="cp-${esc(t.id)}" data-id="${esc(t.id)}" data-mk="${mkOf(t.date)}" aria-label="Category for ${esc(name)}">${catOptions(t.cat)}</select>`}
    <span class="tx-amt ${inc ? "pos" : ""}">${inc ? "+" : ""}${esc(money(t.amount, { cents: true }))}</span></div>`;
}

function wrappedNudge() {
  const t = todayISO(), m = +t.slice(5, 7), d = +t.slice(8);
  const y = m === 12 && d >= 15 ? curYear() : m === 1 ? curYear() - 1 : null;
  if (!y || !yearStats(y).tracked.length) return "";
  return `<section class="card span-12 wrap-cta"><div><span class="eyebrow">Year in review</span><h2>Your ${y} Wrapped is ready</h2><p>Your year in rupees: where it went, what you saved, and your most-ordered-from merchant.</p></div><button class="btn primary" data-action="wrapped" data-year="${y}">Play ${y} Wrapped</button></section>`;
}

function viewOverview() {
  const mk = curMK(), o = outlook(mk), st = o.st, set = S.settings;
  const mName = monthLong(mk), endLabel = dayShort(mk, o.n);
  const flexPct = o.flexBudget > 0 ? o.flexSpent / o.flexBudget : 0, timePct = o.d / o.n;
  const stripCls = flexPct > 1 ? "bad" : flexPct > timePct * 1.15 + 0.05 ? "warn" : "";
  const prevSpent = stats(addMonths(mk, -1)).spent;
  let heroMain;
  if (o.status === "noplan") heroMain = `<div class="eyebrow">${esc(mName)} · day ${o.d} of ${o.n}</div><h1 style="font-size:1.6rem;margin:10px 0 8px">Set your monthly budgets to get a daily spending number.</h1><p>Runway uses your category budgets to work out how much you can spend each day and still finish the month on plan.</p><p style="margin-top:14px"><button class="btn primary" data-action="go" data-tab="budget">Set budgets</button></p>`;
  else {
    const over = o.left < 0;
    heroMain = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="eyebrow">${esc(mName)} · day ${o.d} of ${o.n}</span>${statusPill(o.status)}</div>
      <div class="hero-fig"><span class="big num">${esc(money(o.perDay))}</span><span class="unit">/ day</span></div>
      <p>${over ? `You've gone <strong>${esc(money(-o.left))}</strong> past your ${esc(money(o.cap))} plan. Anything else you spend this month comes out of savings.`
        : `You can spend up to this much each day through ${esc(endLabel)} and stay within your <strong>${esc(money(o.cap))}</strong> spending plan. ${o.fixedDue > 0.5 ? `That already sets aside ${esc(money(o.fixedDue))} for bills still to come.` : ""}`}</p>
      <p>At your current pace you'll spend about <strong>${esc(money(o.projected))}</strong> this month${o.income > 0 ? ` and save <strong>${esc(money(o.projSave))}</strong>${set.savingsGoal > 0 ? ` (goal ${esc(money(set.savingsGoal))})` : ""}` : ""}.</p>`;
  }
  const recent = [...st.tx].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7);
  const saveCls = set.savingsGoal > 0 ? (o.projSave >= set.savingsGoal ? "good" : "bad") : "";
  return `<div class="grid">
    ${wrappedNudge()}${backupNudge()}
    <section class="card span-12"><div class="hero"><div>${heroMain}</div>
      <div class="strip">
        <div class="strip-row"><div class="strip-lab"><span>Month gone by</span><b class="num">${Math.round(timePct * 100)}%</b></div><div class="track time"><i style="width:${(timePct * 100).toFixed(1)}%"></i></div></div>
        <div class="strip-row"><div class="strip-lab"><span>Everyday budget used <span class="muted">(excludes fixed bills)</span></span><b class="num">${Math.round(flexPct * 100)}%</b></div><div class="track spend ${stripCls}"><i style="width:${Math.min(100, flexPct * 100).toFixed(1)}%"></i></div></div>
        <div class="strip-lab"><span class="muted">${flexPct <= timePct ? "Spending is behind the calendar. Good." : stripCls ? "Spending is running ahead of the calendar." : "Spending is roughly keeping pace with the calendar."}</span></div>
      </div></div></section>
    <div class="kpis span-12">
      <div class="kpi"><span class="eyebrow">Spent so far</span><span class="v num">${esc(money(st.spent))}</span><span class="s">${st.count} purchases${o.cap > 0 ? ` · ${Math.round(st.spent / o.cap * 100)}% of plan` : ""}</span></div>
      <div class="kpi"><span class="eyebrow">Left to spend</span><span class="v num">${esc(money(o.left))}</span><span class="s">after ${esc(money(o.fixedDue))} in upcoming bills</span></div>
      <div class="kpi"><span class="eyebrow">Projected total</span><span class="v num">${esc(money(o.projected))}</span><span class="s">${prevSpent > 0 ? `<span class="delta ${o.projected > prevSpent ? "up" : "down"}">${o.projected > prevSpent ? "▲" : "▼"} ${esc(money(Math.abs(o.projected - prevSpent)))}</span> vs ${esc(monthLong(addMonths(mk, -1)))}` : "by month end"}</span></div>
      <div class="kpi"><span class="eyebrow">Projected savings</span><span class="v num">${esc(money(o.projSave))}</span><span class="s">${set.savingsGoal > 0 ? `<span class="delta ${saveCls}">${o.projSave >= set.savingsGoal ? "✓ Goal met" : "Short by " + esc(money(set.savingsGoal - o.projSave))}</span> · goal ${esc(money(set.savingsGoal))}` : o.income > 0 ? `from ${esc(money(o.income))} income` : "Add your income in Budget"}${st.invested > 0 ? ` · ${esc(money(st.invested))} in SIPs` : ""}</span></div>
    </div>
    <div class="span-7 stack">
      <section class="card"><div class="card-h"><h2>Spending through the month</h2><span class="sub">Running total, hover for any day</span></div>${burnChart(mk, o)}</section>
      <section class="card"><div class="card-h"><h2>Recent</h2><button class="btn ghost sm" data-action="go" data-tab="tx">All transactions →</button></div>
        ${recent.length ? `<div>${recent.map(txRow).join("")}</div>` : `<div class="empty"><h3>Nothing logged in ${esc(mName)} yet</h3><p>Add a purchase or import your bank statement. Runway sorts each one into a category for you.</p><button class="btn primary" data-action="add">+ Add expense</button> <button class="btn" data-action="import">Import bank statement</button></div>`}
      </section></div>
    <section class="card span-5" style="align-self:start"><div class="card-h"><h2>Budgets</h2><span class="sub">Tick = even pace for today</span></div>${catRows(o)}</section></div>`;
}

function viewReview() {
  const mk = S.reviewMonth, st = stats(mk), pmk = addMonths(mk, -1), pv = stats(pmk), set = S.settings;
  const income = st.income || (st.count ? set.income : 0), saved = income - st.spent, rate = income > 0 ? saved / income : 0;
  const pIncome = pv.income || (pv.count ? set.income : 0), pSaved = pIncome - pv.spent;
  const cap = planCap();
  const nav = `<div class="monthnav"><button data-action="rev-prev" aria-label="Previous month">‹</button><span>${esc(monthYear(mk))}</span><button data-action="rev-next" aria-label="Next month" ${mk >= curMK() ? "disabled" : ""}>›</button></div>`;
  if (!st.tx.length) return `<div class="toolbar">${nav}</div><div class="card"><div class="empty"><h3>No transactions in ${esc(monthYear(mk))}</h3><p>Import your bank statement for that month and Runway will break it down by category, day and merchant.</p><button class="btn primary" data-action="import">Import bank statement</button></div></div>`;
  const d = (v, pvv, goodWhenUp) => { if (!pv.count) return ""; const diff = v - pvv; if (Math.abs(diff) < 1) return `<span class="delta">no change</span>`; const up = diff > 0; return `<span class="delta ${up === goodWhenUp ? "good" : "bad"}">${up ? "▲" : "▼"} ${esc(money(Math.abs(diff)))}</span>`; };
  const cats = spendCats().map(c => ({ c, v: st.byCat[c.id] || 0, p: pv.byCat[c.id] || 0 })).filter(x => x.v > 0 || x.c.budget > 0).sort((a, b) => b.v - a.v);
  const max = Math.max(...cats.map(x => Math.max(x.v, x.c.budget)), 1);
  const overCats = cats.filter(x => x.c.budget > 0 && x.v > x.c.budget);
  const rbars = cats.map(x => {
    const diff = x.v - x.p, over = x.c.budget > 0 && x.v > x.c.budget;
    return `<div class="rbar" data-tip="${esc(x.c.name)}|Spent ${esc(money(x.v, { cents: true }))}|Budget ${esc(money(x.c.budget))}${pv.count ? "|" + esc(monthLong(pmk)) + ": " + esc(money(x.p)) : ""}">
      <span class="nm">${esc(x.c.name)}</span>
      <span class="rtrack"><i class="${over ? "over" : ""}" style="width:${(x.v / max * 100).toFixed(1)}%"></i>${x.c.budget > 0 ? `<span class="bm" style="left:calc(${(x.c.budget / max * 100).toFixed(1)}% - 1px)"></span>` : ""}</span>
      <span class="v">${esc(money(x.v))}</span>
      <span class="dl">${pv.count && Math.abs(diff) >= 1 ? `<span class="delta ${diff > 0 ? "up" : "down"}">${diff > 0 ? "▲" : "▼"} ${esc(money(Math.abs(diff)))}</span>` : `<span class="muted">—</span>`}</span></div>`;
  }).join("");
  const mer = {};
  for (const t of st.tx) if (t.type !== "income" && kindOf(t.cat) !== "saving") { const k = merchantKey(t.desc) || t.desc.toLowerCase(); (mer[k] = mer[k] || { name: prettyMerchant(t.desc), total: 0, n: 0, cat: t.cat }); mer[k].total += t.amount; mer[k].n++; }
  const topM = Object.values(mer).sort((a, b) => b.total - a.total).slice(0, 6);
  const big = st.tx.filter(t => t.type !== "income" && kindOf(t.cat) !== "saving").sort((a, b) => b.amount - a.amount).slice(0, 5);
  const topCat = cats[0];
  const sixMonths = [5, 4, 3, 2, 1, 0].map(b => addMonths(mk, -b));
  return `<div class="toolbar">${nav}</div>
  <div class="grid">
    <section class="card span-12"><p class="summary-line">In ${esc(monthLong(mk))} you spent <strong>${esc(money(st.spent))}</strong>${cap > 0 ? ` against a ${esc(money(cap))} plan` : ""}${income > 0 ? ` and saved <strong>${esc(money(saved))}</strong>, ${Math.round(rate * 100)}% of your income` : ""}${st.invested > 0 ? `, with ${esc(money(st.invested))} going into SIPs and investments` : ""}. ${topCat && topCat.v > 0 ? `The biggest category was ${esc(topCat.c.name.toLowerCase())} at ${esc(money(topCat.v))}.` : ""} ${overCats.length ? `${overCats.length === 1 ? "One category" : overCats.length + " categories"} went over budget: ${overCats.map(x => `${esc(x.c.name)} (+${esc(money(x.v - x.c.budget))})`).join(", ")}.` : cap > 0 ? "Every category stayed within budget." : ""}</p></section>
    <div class="kpis span-12">
      <div class="kpi"><span class="eyebrow">Income</span><span class="v num">${esc(money(income))}</span><span class="s">${st.income ? "" : "planned · "}${d(income, pIncome, true)}</span></div>
      <div class="kpi"><span class="eyebrow">Spent</span><span class="v num">${esc(money(st.spent))}</span><span class="s">${d(st.spent, pv.spent, false)} ${pv.count ? "vs " + esc(monthLong(pmk)) : st.count + " purchases"}</span></div>
      <div class="kpi"><span class="eyebrow">Saved</span><span class="v num">${esc(money(saved))}</span><span class="s">${d(saved, pSaved, true)}${st.invested > 0 ? ` · ${esc(money(st.invested))} invested` : ""}</span></div>
      <div class="kpi"><span class="eyebrow">Savings rate</span><span class="v num">${income > 0 ? Math.round(rate * 100) + "%" : "—"}</span><span class="s">${income > 0 && rate >= 0.2 ? `<span class="delta good">✓ 20% or more</span>` : "of income kept"}</span></div>
    </div>
    <section class="card span-7"><div class="card-h"><h2>Where it went</h2><span class="sub">Bar = spent · tick = budget · change vs ${esc(monthShort(pmk))}</span></div><div class="rbars">${rbars}</div></section>
    <section class="card span-5"><div class="card-h"><h2>Top merchants</h2><span class="sub">by total spent</span></div><div class="list">${topM.map(m => `<div class="li"><span class="a">${esc(m.name)}</span><span class="b">${esc(money(m.total))}</span><span class="c">${m.n} ${m.n === 1 ? "purchase" : "purchases"} · ${esc(catName(m.cat))}</span></div>`).join("")}</div></section>
    <section class="card span-7"><div class="card-h"><h2>Day by day</h2><span class="sub">Hover a bar for that day's purchases</span></div>${dailyChart(mk)}</section>
    <section class="card span-5"><div class="card-h"><h2>Largest purchases</h2></div><div class="list">${big.map(t => `<div class="li"><span class="a">${esc(prettyMerchant(t.desc))}</span><span class="b">${esc(money(t.amount, { cents: true }))}</span><span class="c">${esc(dateNice(t.date))} · ${esc(catName(t.cat))}</span></div>`).join("")}</div></section>
    <section class="card span-12"><div class="card-h"><h2>Six-month trend</h2><span class="sub">The gap between the bar and the income tick is what you saved</span></div>${monthsChart(sixMonths, mk, 1100)}</section>
  </div>`;
}

function viewYear() {
  const years = yearsWithData();
  if (!S.year || !years.includes(S.year)) S.year = years[years.length - 1];
  const y = S.year, ys = yearStats(y), i = years.indexOf(y);
  const nav = `<div class="monthnav"><button data-action="yr-prev" aria-label="Previous year" ${i <= 0 ? "disabled" : ""}>‹</button><span>${y}${ys.soFar ? " so far" : ""}</span><button data-action="yr-next" aria-label="Next year" ${i >= years.length - 1 ? "disabled" : ""}>›</button></div>`;
  if (!ys.tracked.length) return `<div class="toolbar">${nav}</div><div class="card"><div class="empty"><h3>Nothing tracked in ${y} yet</h3><p>Import your bank statements and your year view and Wrapped fill in automatically.</p><button class="btn primary" data-action="import">Import bank statement</button></div></div>`;
  const max = Math.max(...ys.cats.map(c => c.v), 1);
  const months = ys.tracked.length;
  return `<div class="toolbar">${nav}</div>
  <div class="grid">
    <section class="card span-12 wrap-cta"><div><span class="eyebrow">Runway Wrapped</span><h2>${y}${ys.soFar ? " so far" : ""}, as a story</h2><p>${ys.soFar ? `The full recap lands in December. You can preview it now with ${months} ${months === 1 ? "month" : "months"} of data.` : `Your whole year in ${months} months of spending, saving and habits.`}</p></div><button class="btn primary" data-action="wrapped" data-year="${y}">Play ${y} Wrapped</button></section>
    <div class="kpis span-12">
      <div class="kpi"><span class="eyebrow">Spent</span><span class="v num">${esc(moneyBig(ys.spent))}</span><span class="s">${ys.count} purchases · ${esc(money(ys.spent / Math.max(1, ys.days)))}/day</span></div>
      <div class="kpi"><span class="eyebrow">Income</span><span class="v num">${esc(moneyBig(ys.income))}</span><span class="s">${months} ${months === 1 ? "month" : "months"} tracked</span></div>
      <div class="kpi"><span class="eyebrow">Saved</span><span class="v num">${esc(moneyBig(ys.saved))}</span><span class="s">${ys.income > 0 ? Math.round(ys.rate * 100) + "% of income" : ""}</span></div>
      <div class="kpi"><span class="eyebrow">Into SIPs & investments</span><span class="v num">${esc(moneyBig(ys.invested))}</span><span class="s">part of what you saved</span></div>
    </div>
    <section class="card span-12"><div class="card-h"><h2>Month by month</h2><span class="sub">Hover a month for the details</span></div>${monthsChart(ys.per.map(p => p.mk), null, 1100)}</section>

/* ============================================================
   Last 3 months: this month so far beside the two before it.
   A 3-month bank statement fills all three in one upload.

const window3 = () => { const cm = curMK(); return [addMonths(cm, -2), addMonths(cm, -1), cm]; };
const SERIES = ["s3", "s2", "s1"];                     // oldest → newest; colour follows the month's position
function monthBlock(mk) {
  const st = stats(mk), cm = curMK(), isCur = mk === cm;
  const income = st.income || (st.count ? S.settings.income : 0);
  return { mk, st, isCur, last: isCur ? +todayISO().slice(8) : st.n, income, saved: income - st.spent, has: st.tx.length > 0 };
}
function typicalOf(blocks, fn) {

}
const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th"));
const roundBudget = v => v <= 0 ? 0 : v > 5000 ? Math.ceil(v / 500) * 500 : Math.ceil(v / 100) * 100;

function regularPayments(mks) {
  const [a, b, c] = mks, by = {};
  for (const mk of mks) for (const t of S.months[mk] || []) {
    if (t.type === "income") continue;
    const k = merchantKey(t.desc); if (!k) continue;
    const g = (by[k] = by[k] || { name: prettyMerchant(t.desc), cat: t.cat, m: {} });
    (g.m[mk] = g.m[mk] || []).push(t);
  }
  const today = +todayISO().slice(8), out = [];
  const median = arr => { const s = [...arr].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
  for (const g of Object.values(by)) {
    const pa = g.m[a], pb = g.m[b];
    if (!pa || !pb || pa.length > 2 || pb.length > 2) continue;   // once or twice a month, both earlier months
    const prev = [...pa, ...pb], amts = prev.map(t => t.amount);
    if (Math.max(...amts) / Math.min(...amts) > 1.5) continue;    // roughly the same amount each time
    const amount = median(amts), day = median(prev.map(t => +t.date.slice(8)));

    const status = now.length ? "paid" : day >= today ? "upcoming" : "late";
    out.push({ name: g.name, cat: g.cat, amount, day, status, paid: now[0] || null });
  }
  return out.sort((x, y) => x.day - y.day).slice(0, 12);
}

const triState = {};
function triChart(blocks) {
  const W = 680, H = 290, ml = 54, mr = 112, mt = 18, mb = 30, N = 31;
  const shown = blocks.filter(b => b.has);
  const maxV = Math.max(...shown.map(b => b.st.cum[b.last - 1] || 0), 1000) * 1.06;
  const step = niceStep(maxV, 4), ymax = Math.ceil(maxV / step) * step;
  const X = d => ml + (d / N) * (W - ml - mr), Y = v => H - mb - (v / ymax) * (H - mt - mb);
  let g = "";
  for (let v = 0; v <= ymax + 1e-6; v += step) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${esc(money(v, { compact: true }))}</text>`;
  for (const t of [1, 8, 15, 22, 29]) g += `<text x="${X(t - 0.5)}" y="${H - 8}" text-anchor="middle">${t === 1 ? "Day 1" : t}</text>`;
  g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line-strong)"/>`;
  const labels = [];
  blocks.forEach((b, i) => {
    if (!b.has) return;
    const col = `var(--${SERIES[i]})`;
    let p = `M${X(0)},${Y(0)}`; for (let d = 1; d <= b.last; d++) p += `L${X(d)},${Y(b.st.cum[d - 1])}`;
    g += `<path d="${p}" fill="none" stroke="${col}" stroke-width="${b.isCur ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const end = b.st.cum[b.last - 1] || 0;
    g += `<circle cx="${X(b.last)}" cy="${Y(end)}" r="${b.isCur ? 5 : 3.5}" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`;
    labels.push({ y: Y(end), x: X(N) + 10, t: b.isCur ? `${monthShort(b.mk)} so far` : monthLong(b.mk), v: money(end), col });
  });
  labels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < labels.length; i++) if (labels[i].y - labels[i - 1].y < 32) labels[i].y = labels[i - 1].y + 32;
  for (const l of labels) { l.y = Math.min(Math.max(l.y, mt + 6), H - mb - 18); g += `<rect x="${l.x - 9}" y="${l.y - 8}" width="5" height="5" rx="1" fill="${l.col}"/><text class="lab" x="${l.x}" y="${l.y - 2}">${esc(l.t)}</text><text class="lab-v" x="${l.x}" y="${l.y + 13}" font-weight="700">${esc(l.v)}</text>`; }
  g += `<line id="triX" x1="0" x2="0" y1="${mt}" y2="${H - mb}" stroke="var(--ink-2)" visibility="hidden"/><rect id="triHit" x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent"/>`;
  Object.assign(triState, { blocks, W, ml, mr, N, X });
  return `<div class="chart" id="tri"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running total of spending for each of the last three months">${g}</svg></div>
    <div class="legend">${blocks.map((b, i) => b.has ? `<span><i style="border-color:var(--${SERIES[i]})"></i>${esc(b.isCur ? monthLong(b.mk) + " so far" : monthLong(b.mk))}</span>` : "").join("")}</div>`;
}
function triHover(e) {
  const svg = $("#tri svg"); if (!svg) return;
  const t = triState, r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * t.W;
  const d = Math.min(t.N, Math.max(1, Math.round((vx - t.ml) / (t.W - t.ml - t.mr) * t.N + 0.5)));
