    <p class="muted" style="margin:0;font-size:.88rem">${imp.view === "needs" ? (list.length ? "These didn't match any category. Pick one and every payment to the same shop or person follows, now and in future imports." : "Everything was sorted automatically. Switch to All new to double-check them.") : "Every new row with the category Runway picked. Change any that look wrong; Runway learns from it."}</p>
    <div class="imp-list" id="impList">${list.map(impRow).join("") || `<div class="empty" style="padding:20px"><p style="margin:0">Nothing to check here.</p></div>`}</div>
    <div class="dlg-f"><button class="btn ghost left" id="imBack2">Back</button><button class="btn primary" id="imGo">Add ${fresh.length} ${fresh.length === 1 ? "transaction" : "transactions"}</button></div>`;
  $("#importBody").querySelectorAll("[data-view]").forEach(b => b.onclick = () => { imp.view = b.dataset.view; renderImportReview(); });
  $("#imBack2").onclick = renderImportMap;
  $("#imGo").onclick = commitImport;
  $("#impList").addEventListener("change", e => {
    const sel = e.target.closest("[data-imp]"); if (!sel) return;
    const c = imp.cands[+sel.dataset.imp]; c.cat = sel.value; c.userSet = true; sel.classList.remove("unsorted");
    const key = merchantKey(c.desc); let follow = 0;
    if (key) for (const o of impNew()) if (o !== c && !o.userSet && o.type === "expense" && merchantKey(o.desc) === key) { o.cat = c.cat; o.why = "learned"; follow++; const s2 = document.getElementById("ir-" + imp.cands.indexOf(o)); if (s2) { s2.value = c.cat; s2.classList.remove("unsorted"); } }
    const tag = sel.parentElement.querySelector(".tag"); if (tag) { tag.className = "tag"; tag.textContent = "you picked"; }
    $("#needsN").textContent = impNeeds().length;
    if (follow) toast(`${follow} more "${prettyMerchant(c.desc)}" ${follow === 1 ? "payment" : "payments"} moved to ${catName(c.cat)} too.`);
  });
}
function commitImport() {
  const fresh = impNew(), touched = new Set();
  for (const c of fresh) {
    const t = normalizeTx({ id: newId(), date: c.date, desc: c.desc, amount: c.amount, type: c.type, cat: c.type === "income" ? "" : c.cat, auto: !c.userSet, src: "bank", fp: c.fp, ref: c.ref });
    const mk = mkOf(c.date); (S.months[mk] = S.months[mk] || []).push(t); touched.add(mk);
    if (c.userSet) { const k = merchantKey(c.desc); if (k) S.settings.rules[k] = c.cat; }
  }
  let linked = 0;
  for (const c of imp.cands) if (c.status === "manual" && !c.include) {
    const t = (S.months[c.manualMk] || []).find(x => x.id === c.manualId);
    if (t) { t.fp = c.fp; if (c.ref) t.ref = c.ref; linked++; touched.add(c.manualMk); }
  }
  touched.forEach(mk => S.months[mk].sort((a, b) => a.date.localeCompare(b.date)));
  const all = imp.cands, ds = all.map(c => c.date).sort();
  const rec = { at: todayISO(), file: imp.fileName.slice(0, 80), from: ds[0], to: ds[ds.length - 1], added: fresh.length, skipped: all.filter(c => c.status === "known").length, linked };
  S.settings.imports = [rec, ...(S.settings.imports || [])].slice(0, 24);
  persist();
  $("#importDialog").close();
  const latest = fresh.map(c => mkOf(c.date)).sort().pop();
  if (latest) S.txMonth = latest > curMK() ? curMK() : latest;
  const spanned = new Set(fresh.map(c => mkOf(c.date))).size;
  S.tab = spanned >= 2 ? "review" : "tx"; S.txCat = "all"; S.txSearch = ""; render(); scrollTo({ top: 0 });
  toast(`Added ${fresh.length} new ${fresh.length === 1 ? "transaction" : "transactions"}${fresh.length ? ` (${rangeText(fresh)})` : ""}.${rec.skipped ? ` Skipped ${rec.skipped} already imported.` : ""}${linked ? ` Linked ${linked} you'd added by hand.` : ""}`);
}
async function exportCSV() {
  const rows = [["Date", "Description", "Paid to", "Category", "Type", "Amount (INR)", "Note"]];
  Object.values(S.months).flat().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([t.date, t.desc, prettyMerchant(t.desc), t.type === "income" ? "Income" : catName(t.cat), t.type, (t.type === "income" ? t.amount : -t.amount).toFixed(2), t.note]));
  const csv = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n");
  saveFile(`runway-transactions-${todayISO()}.csv`, "﻿" + csv, "text/csv");
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", e => {
  if (!$("#wrapped").hidden) return;
  const tabBtn = e.target.closest(".tabs [data-tab], .bottom-tabs [data-tab]");
  if (tabBtn) { S.tab = tabBtn.dataset.tab; try { localStorage.setItem("runway.tab", S.tab); } catch {} render(); scrollTo({ top: 0 }); return; }
  const a = e.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action;
  if (act === "add") openTx(curMK(), null);
  else if (act === "edit") openTx(a.dataset.mk, a.dataset.id);
  else if (act === "go") { S.tab = a.dataset.tab; render(); scrollTo({ top: 0 }); }
  else if (act === "rev-prev") { S.reviewMonth = addMonths(S.reviewMonth, -1); render(); }
  else if (act === "rev-next") { S.reviewMonth = addMonths(S.reviewMonth, 1); render(); }
  else if (act === "tx-prev") { S.txMonth = addMonths(S.txMonth, -1); render(); }
  else if (act === "tx-next") { S.txMonth = addMonths(S.txMonth, 1); render(); }
  else if (act === "yr-prev" || act === "yr-next") { const ys = yearsWithData(), i = ys.indexOf(S.year) + (act === "yr-prev" ? -1 : 1); if (ys[i]) { S.year = ys[i]; render(); } }
  else if (act === "wrapped") openWrapped(+a.dataset.year);
  else if (act === "import") openImport();
  else if (act === "export") exportCSV();
  else if (act === "setup") openSetup(false);
  else if (act === "backup-now") backupNow();
  else if (act === "budgets-from-3m") budgetsFrom3m(a);
  else if (act === "db-import") $("#dbFile").click();
  else if (act === "db-merge") dbMerge();
  else if (act === "db-replace") dbReplace(a);
  else if (act === "link-file") linkBackupFile();
  else if (act === "resume-file") resumeBackupFile();
  else if (act === "unlink-file") unlinkBackupFile();
  else if (act === "needs-review") { S.tab = "tx"; S.txCat = "needs"; S.txSearch = ""; render(); scrollTo({ top: 0 }); }
  else if (act === "addcat") {
    const id = "c" + newId().slice(0, 6);
    S.settings.categories.splice(S.settings.categories.length - 1, 0, { id, name: "New category", budget: 0, kind: "everyday", keywords: [] });
    kwIndex = null; persist("settings"); render(); const el = document.getElementById("cn-" + id); if (el) { el.focus(); el.select(); }
  }
  else if (act === "delcat") {
    if (!a.classList.contains("armed")) { a.classList.add("armed", "danger"); a.textContent = "Tap to confirm"; setTimeout(() => { if (a.isConnected) { a.classList.remove("armed", "danger"); a.textContent = "Remove"; } }, 4000); return; }
    const id = a.dataset.cat; const touched = new Set();
    for (const [mk, list] of Object.entries(S.months)) for (const t of list) if (t.cat === id) { t.cat = "other"; t.auto = true; touched.add(mk); }
    S.settings.categories = S.settings.categories.filter(c => c.id !== id);
    for (const k of Object.keys(S.settings.rules)) if (S.settings.rules[k] === id) delete S.settings.rules[k];
    kwIndex = null; persist("settings"); touched.forEach(mk => persist("m-" + mk)); render();
    toast(`Category removed.${touched.size ? " Its transactions moved to Other." : ""}`);
  }
  else if (act === "reset") {
    if (!a.classList.contains("armed")) { a.classList.add("armed"); a.textContent = "Tap again to erase everything"; setTimeout(() => { if (a.isConnected) { a.classList.remove("armed"); a.textContent = "Erase all my data"; } }, 5000); return; }
    eraseAll();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "dbFile") { if (t.files[0]) openDbImport(t.files[0]); t.value = ""; return; }
  if (t.classList.contains("catpick")) { recategorize(t.dataset.mk, t.dataset.id, t.value); return; }
  if (t.id === "txCat") { S.txCat = t.value; $("#txList").innerHTML = txListHTML(); return; }
  if (t.dataset.setting) { S.settings[t.dataset.setting] = Math.max(0, parseAmt(t.value) || 0); persist("settings"); $("#planSummary").innerHTML = planSummaryHTML(); return; }
  if (t.dataset.cat && t.dataset.field) {
    const c = catById(t.dataset.cat); if (!c) return; const f = t.dataset.field;
    if (f === "name") c.name = t.value.trim() || "Untitled";
    else if (f === "budget") c.budget = Math.max(0, parseAmt(t.value) || 0);
    else if (f === "kind") c.kind = KINDS[t.value] ? t.value : "everyday";
    else if (f === "keywords") { c.keywords = t.value.split(",").map(s => s.trim().toLowerCase()).filter(Boolean); kwIndex = null; }
    persist("settings"); $("#planSummary").innerHTML = planSummaryHTML();
  }
});
let searchT;
document.addEventListener("input", e => {
  if (e.target.id === "txSearch") { S.txSearch = e.target.value; clearTimeout(searchT); searchT = setTimeout(() => { const l = $("#txList"); if (l) l.innerHTML = txListHTML(); }, 120); }
});

/* ============================================================
   Boot
   ============================================================ */
buildDemo();
initStore();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

</script>
